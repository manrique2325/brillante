<style>
/* ==========================================================================
   Brillante - hoja de estilos principal
   Los colores y tipografias de la tienda se controlan desde :root
   ========================================================================== */

:root {
  /* Marca */
  --brand: #0f9d8f;
  --brand-dark: #0b6b62;
  --brand-light: #e6f4f1;
  --accent: #ff8a3d;
  --accent-dark: #e06b1f;

  /* Neutros */
  --ink: #12211f;
  --ink-soft: #4d605e;
  --muted: #7b8c8a;
  --line: #e3e9e8;
  --surface: #ffffff;
  --bg: #f5f7f7;

  /* Semanticos */
  --ok: #15a34a;
  --ok-bg: #e7f7ed;
  --warn: #b7791f;
  --warn-bg: #fdf4e3;
  --danger: #d64545;
  --danger-bg: #fdecec;
  --info: #2a6fdb;
  --info-bg: #eaf1fd;

  /* Formas */
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 22px;
  --shadow-sm: 0 1px 2px rgba(18, 33, 31, .06), 0 1px 3px rgba(18, 33, 31, .04);
  --shadow: 0 4px 16px rgba(18, 33, 31, .08);
  --shadow-lg: 0 18px 40px rgba(18, 33, 31, .14);
  --header-h: 128px;

  --font: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* --------------------------------------------------------------- reset -- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.2; letter-spacing: -.02em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); }
h2 { font-size: clamp(1.3rem, 2.4vw, 1.75rem); }
p { margin: 0 0 1em; }
ul { margin: 0; padding: 0; list-style: none; }

.container { width: min(1280px, 100% - 2.5rem); margin-inline: auto; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* -------------------------------------------------------------- botones -- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .72rem 1.25rem; border: 1px solid transparent; border-radius: 999px;
  background: var(--brand); color: #fff; font-weight: 600; font-size: .93rem;
  cursor: pointer; transition: background .18s ease, transform .12s ease, box-shadow .18s ease;
  white-space: nowrap;
}
.btn:hover { background: var(--brand-dark); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid rgba(15, 157, 143, .35); outline-offset: 2px; }
.btn[disabled], .btn.is-disabled { background: #cdd6d5; color: #7b8c8a; cursor: not-allowed; }

.btn--accent { background: var(--accent); }
.btn--accent:hover { background: var(--accent-dark); }
.btn--ghost { background: transparent; color: var(--brand-dark); border-color: var(--line); }
.btn--ghost:hover { background: var(--brand-light); border-color: var(--brand); }
.btn--dark { background: var(--ink); }
.btn--dark:hover { background: #000; }
.btn--danger { background: var(--danger); }
.btn--danger:hover { background: #b52f2f; }
.btn--sm { padding: .45rem .85rem; font-size: .82rem; }
.btn--lg { padding: .95rem 1.75rem; font-size: 1rem; }
.btn--block { width: 100%; }
.btn--link { background: none; color: var(--brand-dark); padding: .3rem; text-decoration: underline; }
.btn--link:hover { background: none; color: var(--ink); }

/* ------------------------------------------------------------ formularios -- */
.field { margin-bottom: 1rem; }
.field label, .form-label {
  display: block; font-size: .82rem; font-weight: 600; color: var(--ink-soft); margin-bottom: .35rem;
}
.input, input[type="text"], input[type="email"], input[type="password"],
input[type="number"], input[type="search"], input[type="tel"], select, textarea {
  width: 100%; padding: .68rem .85rem; border: 1px solid var(--line);
  border-radius: var(--radius-sm); background: #fff; transition: border-color .15s, box-shadow .15s;
}
.input:focus, input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 157, 143, .15);
}
textarea { min-height: 96px; resize: vertical; }
.field-hint { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
.form-grid { display: grid; gap: 0 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .col-full { grid-column: 1 / -1; }

/* ---------------------------------------------------------------- header -- */
.site-header {
  position: sticky; top: 0; z-index: 60; background: var(--surface);
  border-bottom: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.header-top { background: var(--ink); color: #dfe9e7; font-size: .78rem; }
.header-top .container {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem; height: 34px;
}
.header-top a:hover { color: #fff; text-decoration: underline; }
.header-top .header-top__links { display: flex; gap: 1.25rem; }

.header-main .container {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 1.5rem; padding: .9rem 0;
}

.logo { display: inline-flex; align-items: center; gap: .6rem; font-weight: 800; font-size: 1.28rem; letter-spacing: -.03em; }
.logo__mark {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--brand), #16c2a8); color: #fff; font-size: 1.15rem;
  box-shadow: 0 6px 14px rgba(15, 157, 143, .32);
}
.logo__text small { display: block; font-size: .62rem; font-weight: 500; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

/* Buscador */
.search { position: relative; }
.search__form { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .25rem .25rem .25rem 1.1rem; transition: border-color .15s, box-shadow .15s; }
.search__form:focus-within { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px rgba(15, 157, 143, .13); }
.search__input { flex: 1; border: 0; background: transparent; padding: .55rem 0; }
.search__input:focus { outline: none; box-shadow: none; border: 0; }
.search__btn { border: 0; background: var(--brand); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: background .15s; }
.search__btn:hover { background: var(--brand-dark); }

.suggestions {
  position: absolute; top: calc(100% + .5rem); left: 0; right: 0; background: #fff;
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  overflow: hidden; z-index: 80; max-height: 420px; overflow-y: auto;
}
.suggestions[hidden] { display: none; }
.suggestions__group { padding: .4rem 0; border-bottom: 1px solid var(--line); }
.suggestions__group:last-child { border-bottom: 0; }
.suggestions__title { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: .35rem 1rem; }
.suggestion { display: flex; align-items: center; gap: .75rem; padding: .5rem 1rem; cursor: pointer; }
.suggestion:hover, .suggestion.is-active { background: var(--brand-light); }
.suggestion img { width: 38px; height: 38px; object-fit: contain; border-radius: 8px; background: var(--bg); }
.suggestion__name { font-weight: 600; font-size: .87rem; }
.suggestion__meta { font-size: .75rem; color: var(--muted); }
.suggestion__price { margin-left: auto; font-weight: 700; color: var(--brand-dark); font-size: .87rem; }

/* Acciones del header */
.header-actions { display: flex; align-items: center; gap: .35rem; }
.header-action {
  display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border-radius: var(--radius);
  font-size: .85rem; font-weight: 600; color: var(--ink-soft); transition: background .15s, color .15s;
  background: none; border: 0; cursor: pointer;
}
.header-action:hover { background: var(--brand-light); color: var(--brand-dark); }
.header-action__label { display: block; line-height: 1.15; }
.header-action__label small { display: block; font-size: .68rem; font-weight: 500; color: var(--muted); }
.header-action--cart { position: relative; }
.cart-badge {
  position: absolute; top: 2px; right: 4px; min-width: 19px; height: 19px; padding: 0 5px;
  background: var(--accent); color: #fff; border-radius: 999px; font-size: .68rem; font-weight: 700;
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(255, 138, 61, .5);
}
.cart-badge[hidden] { display: none; }
.cart-badge.is-bump { animation: bump .45s ease; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

/* Menu de usuario */
.user-menu { position: relative; }
.user-menu__panel {
  position: absolute; right: 0; top: calc(100% + .5rem); min-width: 216px; background: #fff;
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: .5rem; z-index: 90;
}
.user-menu__panel[hidden] { display: none; }
.user-menu__panel a, .user-menu__panel button {
  display: flex; align-items: center; gap: .6rem; width: 100%; padding: .55rem .7rem;
  border-radius: var(--radius-sm); font-size: .87rem; background: none; border: 0; cursor: pointer; text-align: left;
}
.user-menu__panel a:hover, .user-menu__panel button:hover { background: var(--bg); }
.user-menu__head { padding: .6rem .7rem; border-bottom: 1px solid var(--line); margin-bottom: .35rem; }
.user-menu__head strong { display: block; font-size: .9rem; }
.user-menu__head span { font-size: .75rem; color: var(--muted); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand-light); color: var(--brand-dark); font-weight: 700; font-size: .78rem;
}

/* Navegacion de categorias */
.category-nav { border-top: 1px solid var(--line); background: #fff; }
.category-nav .container { display: flex; align-items: center; gap: .25rem; overflow-x: auto; scrollbar-width: none; }
.category-nav .container::-webkit-scrollbar { display: none; }
.category-nav a {
  padding: .7rem .85rem; font-size: .85rem; font-weight: 500; color: var(--ink-soft);
  white-space: nowrap; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.category-nav a:hover { color: var(--brand-dark); border-color: var(--brand); }
.category-nav a.is-active { color: var(--brand-dark); border-color: var(--brand); font-weight: 600; }
.category-nav a.nav-all { display: flex; align-items: center; gap: .45rem; font-weight: 600; color: var(--ink); }

.menu-toggle { display: none; }

/* ------------------------------------------------------------------ hero -- */
.hero { padding: 2.5rem 0 1rem; }
.hero__inner {
  position: relative; overflow: hidden; border-radius: var(--radius-lg); color: #fff;
  background: linear-gradient(125deg, #0b6b62 0%, #0f9d8f 48%, #16c2a8 100%);
  padding: clamp(2rem, 5vw, 3.6rem); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  gap: 2rem; align-items: center; box-shadow: var(--shadow-lg);
}
.hero__inner::after {
  content: ""; position: absolute; right: -80px; top: -80px; width: 340px; height: 340px;
  border-radius: 50%; background: rgba(255, 255, 255, .09);
}
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: .45rem; background: rgba(255, 255, 255, .18);
  padding: .35rem .85rem; border-radius: 999px; font-size: .76rem; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase; margin-bottom: 1rem;
}
.hero h1 { font-size: clamp(1.9rem, 4.2vw, 3.1rem); margin-bottom: .6rem; }
.hero p { font-size: 1.02rem; opacity: .92; max-width: 46ch; }
.hero__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.6rem; }
.hero__actions .btn { background: #fff; color: var(--brand-dark); }
.hero__actions .btn:hover { background: #eafaf7; }
.hero__actions .btn--outline { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .55); }
.hero__actions .btn--outline:hover { background: rgba(255, 255, 255, .14); }
.hero__stats { display: flex; gap: 1.75rem; margin-top: 2rem; flex-wrap: wrap; }
.hero__stat strong { display: block; font-size: 1.35rem; }
.hero__stat span { font-size: .78rem; opacity: .85; }
.hero__art { position: relative; z-index: 1; display: grid; place-items: center; }
.hero__art .bubble {
  width: min(300px, 80%); aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .14);
  display: grid; place-items: center; font-size: clamp(5rem, 12vw, 8rem); backdrop-filter: blur(2px);
}

/* Tira de beneficios */
.benefits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.5rem; }
.benefit {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem; display: flex; gap: .8rem; align-items: center;
}
.benefit__icon { font-size: 1.4rem; }
.benefit strong { display: block; font-size: .88rem; }
.benefit span { font-size: .78rem; color: var(--muted); }

/* -------------------------------------------------------------- secciones -- */
.section { padding: 2.6rem 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; }
.section-head p { color: var(--muted); margin: .15rem 0 0; font-size: .9rem; }
.section-head a { font-weight: 600; color: var(--brand-dark); font-size: .88rem; white-space: nowrap; }
.section-head a:hover { text-decoration: underline; }
.section--tinted { background: #fff; border-block: 1px solid var(--line); }

/* Categorias */
.category-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; }
.category-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; text-align: center;
}
.category-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--brand); }
.category-card__img { aspect-ratio: 4 / 3; background: var(--brand-light); display: grid; place-items: center; font-size: 2.2rem; }
.category-card__img img { width: 100%; height: 100%; object-fit: cover; }
.category-card__body { padding: .8rem .6rem 1rem; }
.category-card strong { display: block; font-size: .87rem; line-height: 1.3; }
.category-card span { font-size: .74rem; color: var(--muted); }

/* --------------------------------------------------------- product cards -- */
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.1rem; }
.product-grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.product-card {
  position: relative; display: flex; flex-direction: column; background: #fff;
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  transition: transform .18s ease, box-shadow .2s ease, border-color .18s ease;
}
.product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: #cfe3e0; }
.product-card__media { position: relative; aspect-ratio: 1; background: var(--bg); overflow: hidden; }
.product-card__media img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s ease; }
.product-card:hover .product-card__media img { transform: scale(1.05); }
.product-card__badges { position: absolute; top: .6rem; left: .6rem; display: flex; flex-direction: column; gap: .35rem; align-items: flex-start; }
.product-card__body { padding: .85rem .9rem 1rem; display: flex; flex-direction: column; flex: 1; gap: .3rem; }
.product-card__brand { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.product-card__name {
  font-size: .92rem; font-weight: 600; line-height: 1.35; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em;
}
.product-card__name a:hover { color: var(--brand-dark); }
.product-card__unit { font-size: .75rem; color: var(--muted); }
.product-card__price { margin-top: auto; padding-top: .5rem; }
.product-card__actions { margin-top: .7rem; display: flex; gap: .4rem; }
.product-card__actions .btn { flex: 1; }

.price { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.price__now { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; }
.price__old { font-size: .82rem; color: var(--muted); text-decoration: line-through; }
.price__off { font-size: .78rem; font-weight: 700; color: var(--ok); }

.badge {
  display: inline-flex; align-items: center; gap: .25rem; padding: .22rem .55rem;
  border-radius: 999px; font-size: .68rem; font-weight: 700; letter-spacing: .02em;
}
.badge--sale { background: var(--accent); color: #fff; }
.badge--new { background: var(--info); color: #fff; }
.badge--featured { background: var(--ink); color: #fff; }
.badge--out { background: #cdd6d5; color: #43514f; }
.badge--low { background: var(--warn-bg); color: var(--warn); }
.badge--ok { background: var(--ok-bg); color: var(--ok); }
.badge--info { background: var(--info-bg); color: var(--info); }
.badge--danger { background: var(--danger-bg); color: var(--danger); }

.stock-line { font-size: .76rem; font-weight: 600; display: flex; align-items: center; gap: .35rem; }
.stock-line--ok { color: var(--ok); }
.stock-line--low { color: var(--warn); }
.stock-line--out { color: var(--danger); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.product-card.is-out .product-card__media img { opacity: .55; filter: grayscale(.4); }

/* ---------------------------------------------------------- listado + filtros -- */
.catalog { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 1.8rem; align-items: start; padding: 1.8rem 0 3rem; }
.filters {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem; position: sticky; top: calc(var(--header-h) + 12px);
}
.filters__group { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.filters__group:last-of-type { border-bottom: 0; }
.filters__group > h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .6rem; }
.filters__list { max-height: 210px; overflow-y: auto; display: grid; gap: .1rem; }
.check { display: flex; align-items: center; gap: .55rem; font-size: .85rem; padding: .25rem 0; cursor: pointer; }
.check input { width: auto; accent-color: var(--brand); }
.price-range { display: flex; align-items: center; gap: .5rem; }
.price-range input { padding: .5rem .6rem; font-size: .85rem; }
.filters__actions { display: grid; gap: .5rem; margin-top: 1rem; }

.catalog-toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: .75rem 1rem; margin-bottom: 1.1rem;
}
.catalog-toolbar__count { font-size: .88rem; color: var(--ink-soft); }
.catalog-toolbar__count strong { color: var(--ink); }
.sort-select { width: auto; min-width: 200px; font-size: .87rem; padding: .5rem .7rem; }
.filters-toggle { display: none; }

.active-filters { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
.chip {
  display: inline-flex; align-items: center; gap: .4rem; background: #fff; border: 1px solid var(--line);
  border-radius: 999px; padding: .3rem .75rem; font-size: .8rem;
}
.chip a { color: var(--muted); font-weight: 700; }
.chip a:hover { color: var(--danger); }

/* Breadcrumbs */
.breadcrumbs { display: flex; flex-wrap: wrap; gap: .4rem; font-size: .8rem; color: var(--muted); padding: 1rem 0 0; }
.breadcrumbs a:hover { color: var(--brand-dark); text-decoration: underline; }
.breadcrumbs span[aria-current] { color: var(--ink-soft); font-weight: 600; }

/* Paginacion */
.pagination { display: flex; justify-content: center; align-items: center; gap: .3rem; margin-top: 2rem; flex-wrap: wrap; }
.pagination a, .pagination span {
  min-width: 40px; height: 40px; padding: 0 .7rem; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; font-size: .87rem; font-weight: 600;
}
.pagination a:hover { border-color: var(--brand); color: var(--brand-dark); }
.pagination .is-current { background: var(--brand); border-color: var(--brand); color: #fff; }
.pagination .is-disabled { color: #c3cecd; background: var(--bg); }
.pagination .gap { border: 0; background: none; }

/* ------------------------------------------------------- detalle producto -- */
.product-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; padding: 1.5rem 0 2rem; }
.product-gallery { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.5rem; position: sticky; top: calc(var(--header-h) + 12px); }
.product-gallery img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.product-gallery__badges { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .5rem; }
.product-info__brand { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--brand-dark); font-weight: 700; }
.product-info h1 { margin: .3rem 0 .5rem; }
.product-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: .8rem; color: var(--muted); margin-bottom: 1.2rem; }
.product-price-box { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1.2rem; }
.product-price-box .price__now { font-size: 2.1rem; }
.product-price-box .price__old { font-size: 1rem; }
.product-price-box .price__off { font-size: .95rem; }
.savings { font-size: .85rem; color: var(--ok); font-weight: 600; margin-top: .3rem; }
.buy-row { display: flex; gap: .75rem; align-items: center; margin-top: 1.1rem; flex-wrap: wrap; }
.qty {
  display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff;
}
.qty button { width: 38px; height: 42px; border: 0; background: none; cursor: pointer; font-size: 1.1rem; color: var(--ink-soft); }
.qty button:hover:not(:disabled) { background: var(--brand-light); color: var(--brand-dark); }
.qty button:disabled { color: #cdd6d5; cursor: not-allowed; }
.qty input { width: 48px; border: 0; text-align: center; font-weight: 700; padding: 0; }
.qty input:focus { box-shadow: none; }
.qty--sm button { width: 30px; height: 32px; font-size: .95rem; }
.qty--sm input { width: 38px; font-size: .87rem; }

.product-section { border-top: 1px solid var(--line); padding-top: 1.3rem; margin-top: 1.3rem; }
.product-section h3 { font-size: 1rem; }
.spec-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .55rem 1rem; font-size: .87rem; }
.spec-list div { display: flex; justify-content: space-between; gap: .5rem; border-bottom: 1px dashed var(--line); padding-bottom: .35rem; }
.spec-list dt, .spec-list .k { color: var(--muted); }
.spec-list .v { font-weight: 600; text-align: right; }
.shipping-note { display: flex; gap: .7rem; align-items: flex-start; background: var(--brand-light); border-radius: var(--radius); padding: .9rem 1rem; font-size: .85rem; }

/* ------------------------------------------------------------------ carrito -- */
.cart-layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 1.8rem; align-items: start; padding: 1.5rem 0 3rem; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
.panel__head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.panel__head h2, .panel__head h3 { margin: 0; font-size: 1.05rem; }
.panel__body { padding: 1.25rem; }
.panel__foot { padding: 1rem 1.25rem; border-top: 1px solid var(--line); }

.cart-item { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 1rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--line); align-items: center; }
.cart-item:last-child { border-bottom: 0; }
.cart-item__img { width: 90px; height: 90px; object-fit: contain; background: var(--bg); border-radius: var(--radius-sm); }
.cart-item__name { font-weight: 600; font-size: .95rem; }
.cart-item__meta { font-size: .78rem; color: var(--muted); }
.cart-item__controls { display: flex; align-items: center; gap: .75rem; margin-top: .6rem; flex-wrap: wrap; }
.cart-item__total { text-align: right; font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.cart-item__unit { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); }
.link-danger { background: none; border: 0; color: var(--muted); font-size: .8rem; cursor: pointer; padding: 0; text-decoration: underline; }
.link-danger:hover { color: var(--danger); }

.summary { position: sticky; top: calc(var(--header-h) + 12px); }
.summary__row { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; padding: .4rem 0; }
.summary__row--discount { color: var(--ok); font-weight: 600; }
.summary__total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: .6rem; padding-top: .8rem; font-weight: 800; font-size: 1.3rem; }
.progress { height: 7px; background: var(--bg); border-radius: 99px; overflow: hidden; margin: .5rem 0 .35rem; }
.progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #16c2a8); border-radius: 99px; transition: width .4s ease; }

/* ------------------------------------------------------------------ checkout -- */
.checkout-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1.8rem; align-items: start; padding: 1.5rem 0 3rem; }
.steps { display: flex; gap: .5rem; align-items: center; margin-bottom: 1.5rem; font-size: .83rem; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: .45rem; color: var(--muted); }
.step__num { width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--ink-soft); display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
.step.is-active { color: var(--ink); font-weight: 600; }
.step.is-active .step__num { background: var(--brand); color: #fff; }
.step.is-done .step__num { background: var(--ok); color: #fff; }
.step__sep { flex: 1; min-width: 18px; height: 1px; background: var(--line); }

.payment-options { display: grid; gap: .65rem; }
.payment-option { display: flex; gap: .75rem; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; cursor: pointer; transition: border-color .15s, background .15s; }
.payment-option:hover { border-color: var(--brand); }
.payment-option input { width: auto; margin-top: .2rem; accent-color: var(--brand); }
.payment-option strong { display: block; font-size: .9rem; }
.payment-option span { font-size: .79rem; color: var(--muted); }
.payment-option:has(input:checked) { border-color: var(--brand); background: var(--brand-light); }

.mini-item { display: flex; gap: .7rem; align-items: center; padding: .55rem 0; border-bottom: 1px dashed var(--line); }
.mini-item:last-child { border-bottom: 0; }
.mini-item img { width: 46px; height: 46px; object-fit: contain; background: var(--bg); border-radius: 6px; }
.mini-item__name { font-size: .83rem; font-weight: 600; line-height: 1.3; }
.mini-item__meta { font-size: .75rem; color: var(--muted); }
.mini-item__price { margin-left: auto; font-weight: 700; font-size: .87rem; white-space: nowrap; }

/* ------------------------------------------------------------------ pedidos -- */
.order-success { text-align: center; padding: 2.5rem 1rem 1rem; }
.order-success__icon { width: 76px; height: 76px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: grid; place-items: center; font-size: 2.2rem; margin: 0 auto 1rem; }
.order-number { display: inline-block; background: var(--ink); color: #fff; padding: .5rem 1.1rem; border-radius: 999px; font-weight: 700; letter-spacing: .04em; }

.order-card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; margin-bottom: 1rem; }
.order-card__head { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
.order-card__num { font-weight: 700; }
.order-card__date { font-size: .78rem; color: var(--muted); }
.order-card__body { padding: 1rem 1.25rem; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
.order-thumbs { display: flex; gap: .4rem; flex-wrap: wrap; }
.order-thumbs img { width: 44px; height: 44px; object-fit: contain; background: var(--bg); border-radius: 6px; border: 1px solid var(--line); }
.order-thumbs .more { width: 44px; height: 44px; border-radius: 6px; background: var(--bg); display: grid; place-items: center; font-size: .75rem; color: var(--muted); border: 1px solid var(--line); }

.status { display: inline-flex; align-items: center; gap: .35rem; padding: .3rem .7rem; border-radius: 999px; font-size: .76rem; font-weight: 700; }
.status--pendiente { background: var(--warn-bg); color: var(--warn); }
.status--confirmado { background: var(--info-bg); color: var(--info); }
.status--preparando { background: #f1ecfd; color: #6c46c0; }
.status--enviado { background: #e6f4f1; color: var(--brand-dark); }
.status--entregado { background: var(--ok-bg); color: var(--ok); }
.status--cancelado { background: var(--danger-bg); color: var(--danger); }

.timeline { display: flex; gap: 0; margin: 1.2rem 0; flex-wrap: wrap; }
.timeline__step { flex: 1; min-width: 92px; text-align: center; font-size: .74rem; color: var(--muted); position: relative; padding-top: 26px; }
.timeline__step::before { content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--line); z-index: 2; }
.timeline__step::after { content: ""; position: absolute; top: 12px; left: 0; width: 100%; height: 2px; background: var(--line); }
.timeline__step:first-child::after { left: 50%; width: 50%; }
.timeline__step:last-child::after { width: 50%; }
.timeline__step.is-done { color: var(--brand-dark); font-weight: 600; }
.timeline__step.is-done::before { background: var(--brand); }
.timeline__step.is-done::after { background: var(--brand); }

/* --------------------------------------------------------------- cuenta -- */
.account-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1.8rem; align-items: start; padding: 1.5rem 0 3rem; }
.account-nav { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: .6rem; position: sticky; top: calc(var(--header-h) + 12px); }
.account-nav a { display: flex; align-items: center; gap: .6rem; padding: .65rem .8rem; border-radius: var(--radius-sm); font-size: .88rem; font-weight: 500; }
.account-nav a:hover { background: var(--bg); }
.account-nav a.is-active { background: var(--brand-light); color: var(--brand-dark); font-weight: 600; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.25rem; }
.stat-card span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat-card strong { display: block; font-size: 1.6rem; letter-spacing: -.02em; margin-top: .2rem; }

/* --------------------------------------------------------------- auth -- */
.auth-wrap { display: grid; place-items: center; padding: 3rem 0; min-height: 62vh; }
.auth-card { width: min(440px, 100%); background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 1.5rem; text-align: center; }
.auth-card__sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 1.5rem; }
.auth-alt { text-align: center; font-size: .87rem; margin-top: 1.25rem; color: var(--muted); }
.auth-alt a { color: var(--brand-dark); font-weight: 600; }
.demo-box { background: var(--brand-light); border-radius: var(--radius-sm); padding: .8rem 1rem; font-size: .8rem; margin-top: 1.25rem; }
.demo-box code { background: rgba(255, 255, 255, .8); padding: .1rem .35rem; border-radius: 4px; font-size: .78rem; }

/* --------------------------------------------------------------- estados -- */
.empty-state { text-align: center; padding: 3.5rem 1.5rem; }
.empty-state__icon { font-size: 3.2rem; margin-bottom: .75rem; opacity: .75; }
.empty-state h2, .empty-state h3 { margin-bottom: .4rem; }
.empty-state p { color: var(--muted); max-width: 46ch; margin-inline: auto; }
.empty-state .btn { margin-top: 1.2rem; }

.error-page { text-align: center; padding: 4.5rem 1.5rem; }
.error-page__code { font-size: clamp(4rem, 14vw, 8rem); font-weight: 800; letter-spacing: -.05em; color: var(--brand); line-height: 1; }

/* ---------------------------------------------------------------- toasts -- */
.toasts { position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 200; display: flex; flex-direction: column; gap: .6rem; max-width: min(360px, calc(100vw - 2rem)); }
.toast {
  display: flex; align-items: flex-start; gap: .7rem; background: #fff; border: 1px solid var(--line);
  border-left: 4px solid var(--brand); border-radius: var(--radius); padding: .85rem 1rem;
  box-shadow: var(--shadow-lg); font-size: .87rem; animation: toast-in .28s cubic-bezier(.2, .9, .3, 1.2);
}
.toast.is-out { animation: toast-out .25s ease forwards; }
.toast--success { border-left-color: var(--ok); }
.toast--error { border-left-color: var(--danger); }
.toast--info { border-left-color: var(--info); }
.toast__icon { font-size: 1rem; line-height: 1.3; }
.toast__close { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }

/* ----------------------------------------------------------- back to top -- */
.to-top {
  position: fixed; right: 1.25rem; bottom: 1.25rem; width: 44px; height: 44px; border-radius: 50%;
  background: var(--ink); color: #fff; border: 0; display: grid; place-items: center; cursor: pointer;
  box-shadow: var(--shadow-lg); opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity .2s, transform .2s, visibility .2s; z-index: 150;
}
.to-top.is-visible { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { background: var(--brand-dark); }
.toasts:not(:empty) ~ .to-top { bottom: auto; top: calc(100vh - 5.5rem); }

/* ---------------------------------------------------------------- footer -- */
.site-footer { background: var(--ink); color: #b9c8c6; margin-top: 3rem; font-size: .87rem; }
.footer-grid { display: grid; grid-template-columns: 1.6fr repeat(3, 1fr); gap: 2rem; padding: 3rem 0 2rem; }
.site-footer h4 { color: #fff; font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 1rem; }
.site-footer li { margin-bottom: .5rem; }
.site-footer a:hover { color: #fff; }
.site-footer .logo { color: #fff; margin-bottom: .75rem; }
.footer-brand p { max-width: 34ch; }
.social { display: flex; gap: .5rem; margin-top: 1rem; }
.social a { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .08); display: grid; place-items: center; transition: background .15s; }
.social a:hover { background: var(--brand); }
.payments { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .8rem; }
.payments span { background: rgba(255, 255, 255, .08); border-radius: 6px; padding: .3rem .6rem; font-size: .72rem; }
.footer-bottom { border-top: 1px solid rgba(255, 255, 255, .1); padding: 1.1rem 0; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: .78rem; }

/* ---------------------------------------------------------------- tablas -- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .87rem; }
table.data th, table.data td { padding: .75rem .85rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--bg); font-weight: 700; }
table.data tbody tr:hover { background: #fafcfc; }
table.data .num { text-align: right; }

/* --------------------------------------------------------------- skeleton -- */
.skeleton { background: linear-gradient(90deg, #eef2f2 25%, #f7fafa 50%, #eef2f2 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius-sm); }
@keyframes shimmer { to { background-position: -200% 0; } }
.is-loading { opacity: .55; pointer-events: none; transition: opacity .15s; }

/* ------------------------------------------------------------ responsive -- */
@media (max-width: 1100px) {
  .category-grid { grid-template-columns: repeat(4, 1fr); }
  .product-grid--4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .cart-layout, .checkout-layout { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; }
}

@media (max-width: 900px) {
  :root { --header-h: 108px; }
  .header-main .container { grid-template-columns: auto minmax(0, 1fr) auto; gap: .75rem; }
  .header-action__label { display: none; }
  .header-action { padding: .5rem; }
  .hero__inner { grid-template-columns: 1fr; }
  .hero__art { display: none; }
  .benefits { grid-template-columns: repeat(2, 1fr); }
  .product-detail { grid-template-columns: 1fr; gap: 1.5rem; }
  .product-gallery { position: static; }
  .account-layout { grid-template-columns: 1fr; }
  .account-nav { position: static; display: flex; overflow-x: auto; }
  .account-nav a { white-space: nowrap; }

  /* Filtros como panel deslizante en mobile */
  .catalog { grid-template-columns: 1fr; }
  .filters-toggle { display: inline-flex; }
  .filters {
    position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); z-index: 130; border-radius: 0;
    overflow-y: auto; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg);
  }
  .filters.is-open { transform: none; }
  .filters__close { display: block !important; }
  .filters-backdrop { position: fixed; inset: 0; background: rgba(18, 33, 31, .45); z-index: 120; }
  .filters-backdrop[hidden] { display: none; }
}

@media (max-width: 760px) {
  body { font-size: 14.5px; }
  .container { width: min(1280px, 100% - 1.75rem); }
  .header-top .header-top__links { display: none; }
  .header-main .container { grid-template-columns: auto auto; grid-template-areas: "logo actions" "search search"; row-gap: .6rem; }
  .logo { grid-area: logo; }
  .search { grid-area: search; }
  .header-actions { grid-area: actions; }
  .menu-toggle { display: inline-flex; }
  .category-grid { grid-template-columns: repeat(2, 1fr); }
  .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
  .product-grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .product-card__name { font-size: .85rem; }
  .price__now { font-size: 1.05rem; }
  .form-grid { grid-template-columns: 1fr; }
  .spec-list { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: 1fr 1fr; }
  .cart-item { grid-template-columns: 72px minmax(0, 1fr); grid-template-areas: "img body" "total total"; }
  .cart-item__img { grid-area: img; width: 72px; height: 72px; }
  .cart-item__total { grid-area: total; text-align: left; }
  .footer-grid { grid-template-columns: 1fr; gap: 1.5rem; }
  .toasts { left: 1rem; right: 1rem; max-width: none; bottom: 1rem; }
  .section { padding: 1.8rem 0; }
}

@media (max-width: 460px) {
  .benefits { grid-template-columns: 1fr; }
  .hero__stats { gap: 1rem; }
  .buy-row { flex-direction: column; align-items: stretch; }
  .buy-row .qty { justify-content: space-between; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

@media print {
  .site-header, .site-footer, .to-top, .toasts, .no-print { display: none !important; }
  body { background: #fff; }
}

/* ==========================================================================
   Panel de administracion - complementa styles.css
   ========================================================================== */

.admin-body { background: #f2f5f5; }

.admin-layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }

/* ------------------------------------------------------------- sidebar -- */
.admin-sidebar {
  background: var(--ink); color: #b9c8c6; padding: 1.1rem .85rem;
  display: flex; flex-direction: column; gap: .3rem;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.admin-sidebar .logo { color: #fff; margin-bottom: 1.2rem; padding: 0 .5rem; }
.admin-sidebar__label {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .1em;
  color: #6d817f; padding: .9rem .75rem .35rem;
}
.admin-nav-link {
  display: flex; align-items: center; gap: .65rem; padding: .62rem .75rem;
  border-radius: var(--radius-sm); font-size: .89rem; font-weight: 500;
  transition: background .15s, color .15s;
}
.admin-nav-link:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.admin-nav-link.is-active { background: var(--brand); color: #fff; font-weight: 600; }
.admin-nav-link .count { margin-left: auto; font-size: .72rem; background: rgba(255, 255, 255, .12); padding: .1rem .45rem; border-radius: 999px; }
.admin-sidebar__foot { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .1); padding-top: .75rem; }

/* --------------------------------------------------------------- topbar -- */
.admin-main { min-width: 0; display: flex; flex-direction: column; }
.admin-topbar {
  background: #fff; border-bottom: 1px solid var(--line); padding: .85rem 1.75rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 40;
}
.admin-topbar h1 { margin: 0; font-size: 1.2rem; }
.admin-topbar__sub { font-size: .8rem; color: var(--muted); }
.admin-topbar__actions { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.admin-content { padding: 1.5rem 1.75rem 3rem; }

/* ------------------------------------------------------------ tarjetas -- */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.kpi {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem 1.25rem; position: relative; overflow: hidden;
}
.kpi__icon {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--brand-light); font-size: 1.1rem; margin-bottom: .7rem;
}
.kpi__label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi__value { font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-top: .15rem; }
.kpi__hint { font-size: .78rem; color: var(--muted); margin-top: .2rem; }
.kpi--accent .kpi__icon { background: #fff2e8; }
.kpi--danger .kpi__icon { background: var(--danger-bg); }
.kpi--ok .kpi__icon { background: var(--ok-bg); }

.admin-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.admin-grid--even { grid-template-columns: repeat(2, minmax(0, 1fr)); }

/* -------------------------------------------------------------- grafico -- */
.chart { display: flex; align-items: flex-end; gap: .5rem; height: 200px; padding: 1rem .25rem 0; }
.chart__col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: .4rem; height: 100%; }
.chart__bar {
  width: 100%; max-width: 34px; border-radius: 6px 6px 2px 2px; min-height: 3px;
  background: linear-gradient(180deg, #16c2a8, var(--brand)); transition: opacity .15s;
  position: relative;
}
.chart__col:hover .chart__bar { opacity: .8; }
.chart__label { font-size: .68rem; color: var(--muted); white-space: nowrap; }
.chart__value { font-size: .66rem; color: var(--ink-soft); font-weight: 700; }

.bar-list { display: grid; gap: .8rem; }
.bar-list__item { font-size: .85rem; }
.bar-list__head { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: .3rem; }
.bar-list__track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.bar-list__fill { height: 100%; background: var(--brand); border-radius: 99px; }

/* -------------------------------------------------------------- toolbar -- */
.admin-toolbar {
  display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: .75rem 1rem; margin-bottom: 1.1rem;
}
.admin-toolbar form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.admin-toolbar input, .admin-toolbar select { width: auto; min-width: 180px; padding: .5rem .7rem; font-size: .87rem; }
.admin-toolbar .spacer { margin-left: auto; }
.filter-tabs { display: flex; gap: .35rem; flex-wrap: wrap; }
.filter-tab {
  padding: .38rem .8rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
  border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
}
.filter-tab:hover { border-color: var(--brand); color: var(--brand-dark); }
.filter-tab.is-active { background: var(--ink); border-color: var(--ink); color: #fff; }

/* --------------------------------------------------------------- tablas -- */
.admin-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.admin-card__head {
  padding: .95rem 1.15rem; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.admin-card__head h2, .admin-card__head h3 { margin: 0; font-size: 1rem; }
.admin-card__body { padding: 1.15rem; }
.admin-card__foot { padding: .85rem 1.15rem; border-top: 1px solid var(--line); }

.thumb { width: 44px; height: 44px; object-fit: contain; background: var(--bg); border-radius: 8px; border: 1px solid var(--line); }
.cell-product { display: flex; align-items: center; gap: .75rem; min-width: 240px; }
.cell-product strong { display: block; font-size: .88rem; line-height: 1.3; }
.cell-product span { font-size: .75rem; color: var(--muted); }
.row-actions { display: flex; gap: .35rem; justify-content: flex-end; flex-wrap: wrap; }

.inline-stock { display: flex; gap: .3rem; align-items: center; }
.inline-stock input { width: 74px; padding: .35rem .5rem; font-size: .85rem; text-align: center; }

.status-select { padding: .4rem .6rem; font-size: .82rem; width: auto; min-width: 150px; }

/* ----------------------------------------------------------- formulario -- */
.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.25rem; align-items: start; }
.form-section { margin-bottom: 1.4rem; }
.form-section > h3 { font-size: .95rem; margin-bottom: .8rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line); }
.switch-row { display: flex; align-items: flex-start; gap: .65rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.switch-row:last-child { border-bottom: 0; }
.switch-row input { width: auto; margin-top: .2rem; accent-color: var(--brand); }
.switch-row strong { display: block; font-size: .87rem; }
.switch-row span { font-size: .77rem; color: var(--muted); }
.image-preview {
  aspect-ratio: 1; background: var(--bg); border: 1px dashed var(--line); border-radius: var(--radius);
  display: grid; place-items: center; overflow: hidden; margin-bottom: .75rem;
}
.image-preview img { width: 100%; height: 100%; object-fit: contain; }

.alert { border-radius: var(--radius); padding: .85rem 1rem; font-size: .87rem; margin-bottom: 1rem; }
.alert--info { background: var(--info-bg); color: #1c4c9c; }
.alert--warn { background: var(--warn-bg); color: var(--warn); }

/* ----------------------------------------------------------- responsive -- */
@media (max-width: 1000px) {
  .admin-grid, .admin-grid--even, .form-layout { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 820px) {
  .admin-layout { grid-template-columns: 1fr; }
  .admin-sidebar {
    position: static; height: auto; flex-direction: row; overflow-x: auto; align-items: center;
    padding: .6rem .75rem; gap: .35rem;
  }
  .admin-sidebar .logo, .admin-sidebar__label { display: none; }
  .admin-sidebar__foot { margin: 0; border: 0; padding: 0; }
  .admin-nav-link { white-space: nowrap; }
  .admin-content { padding: 1.1rem 1rem 3rem; }
  .admin-topbar { padding: .75rem 1rem; }
  .chart { height: 160px; }
  .chart__label { font-size: .6rem; transform: rotate(-45deg); }
}

/* ==========================================================================
   Ajustes propios de la version de un solo archivo (SPA con hash routing).
   Se suma a styles.css + admin.css sin modificarlos.
   ========================================================================== */

/* El panel admin ocupa toda la pantalla, sin el header de la tienda */
.admin-body .site-header,
.admin-body .site-footer { display: none; }
body.admin-body { background: #f2f5f5; }

/* Aviso de version estatica */
.demo-bar {
  background: #1d2b2a; color: #cfe0de; font-size: .78rem; text-align: center;
  padding: .45rem 1rem; display: flex; gap: .75rem; justify-content: center;
  align-items: center; flex-wrap: wrap;
}
.demo-bar strong { color: #fff; }
.demo-bar button {
  background: rgba(255,255,255,.12); border: 0; color: #fff; cursor: pointer;
  font: inherit; padding: .2rem .65rem; border-radius: 999px;
}
.demo-bar button:hover { background: var(--brand); }

/* Transicion suave entre vistas */
.view-enter { animation: view-in .22s ease; }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* El listado usa un <form> real; en la SPA los filtros se aplican al vuelo */
.filters form { margin: 0; }

/* Detalles de tablas del admin dentro de la SPA */
.admin-card details summary::-webkit-details-marker { display: none; }
.admin-card details summary { list-style: none; }

/* La galeria del producto no necesita sticky cuando el alto es chico */
@media (max-height: 700px) { .product-gallery { position: static; } }

</style>
