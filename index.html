            </tr>`
                  )
                  .join("")
              : '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:2rem">Todo el catálogo tiene stock suficiente. 🎉</td></tr>'
          }
        </tbody>
      </table>
    </div>
  </section>
</div>

${
  top.length
    ? `<section class="admin-card" style="margin-top:1.25rem">
         <div class="admin-card__head"><h2>Productos más vendidos</h2></div>
         <div class="table-wrap"><table class="data">
           <thead><tr><th>#</th><th>Producto</th><th class="num">Unidades</th><th class="num">Facturación</th></tr></thead>
           <tbody>${top
             .map(
               (row, index) => `<tr>
                 <td style="width:40px;color:var(--muted);font-weight:700">${index + 1}</td>
                 <td>${APP.esc(row.name)}</td>
                 <td class="num"><strong>${row.units}</strong></td>
                 <td class="num">${APP.money(row.revenue)}</td>
               </tr>`
             )
             .join("")}</tbody>
         </table></div>
       </section>`
    : ""
}`;

  return APP.ui.adminShell(inner, {
    title: "Dashboard",
    subtitle: `Resumen de la operación de ${APP.store.config.storeName}`,
    actions: `<a class="btn btn--sm" href="${APP.url("admin/productos/nuevo")}">+ Nuevo producto</a>`,
    active: "dashboard",
  });
};

/* -------------------------------------------------------------- productos -- */
APP.admin.products = function (params) {
  const store = APP.store;
  const term = (params.get("q") || "").trim();
  const categoryId = params.get("categoria") ? Number(params.get("categoria")) : null;
  const stockFilter = params.get("stock");
  const estado = params.get("estado");
  const page = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);

  let items = store.products().slice();
  if (term) {
    const needle = APP.normalize(term);
    items = items.filter((p) => APP.normalize(`${p.name} ${p.brand} ${p.sku}`).includes(needle));
  }
  if (categoryId) items = items.filter((p) => p.categoryId === categoryId);
  if (stockFilter === "bajo") items = items.filter((p) => p.stock <= APP.admin.LOW_STOCK);
  if (estado === "inactivos") items = items.filter((p) => !p.active);
  items.sort((a, b) => b.id - a.id);

  const perPage = 20;
  const pages = Math.max(1, Math.ceil(items.length / perPage));
  const current = Math.min(page, pages);
  const visible = items.slice((current - 1) * perPage, current * perPage);

  const inner = `
<div class="admin-toolbar">
  <form id="admin-products-filter">
    <input type="search" name="q" value="${APP.esc(term)}" placeholder="Buscar por nombre, marca o SKU…">
    <select name="categoria">
      <option value="">Todas las categorías</option>
      ${store.categories().map((c) => `<option value="${c.id}" ${categoryId === c.id ? "selected" : ""}>${APP.esc(c.name)}</option>`).join("")}
    </select>
    ${stockFilter ? `<input type="hidden" name="stock" value="${APP.esc(stockFilter)}">` : ""}
    ${estado ? `<input type="hidden" name="estado" value="${APP.esc(estado)}">` : ""}
    <button class="btn btn--sm" type="submit">Buscar</button>
    ${term || categoryId || stockFilter || estado ? `<a class="btn btn--sm btn--ghost" href="${APP.url("admin/productos")}">Limpiar</a>` : ""}
  </form>
  <div class="spacer"></div>
  <div class="filter-tabs">
    <a class="filter-tab ${!stockFilter && !estado ? "is-active" : ""}" href="${APP.url("admin/productos", term ? { q: term } : {})}">Todos</a>
    <a class="filter-tab ${stockFilter === "bajo" ? "is-active" : ""}" href="${APP.url("admin/productos", Object.assign({ stock: "bajo" }, term ? { q: term } : {}))}">Stock bajo</a>
    <a class="filter-tab ${estado === "inactivos" ? "is-active" : ""}" href="${APP.url("admin/productos", Object.assign({ estado: "inactivos" }, term ? { q: term } : {}))}">Inactivos</a>
  </div>
</div>

<div class="admin-card">
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>Producto</th><th>Categoría</th><th class="num">Precio</th><th>Stock</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody>
        ${
          visible.length
            ? visible
                .map(
                  (product) => `
          <tr>
            <td>
              <div class="cell-product">
                <img class="thumb" src="${APP.images.product(product)}" alt="">
                <div>
                  <strong>${APP.esc(product.name)}</strong>
                  <span>${APP.esc(product.brand)} · ${APP.esc(product.sku)}${product.unit ? " · " + APP.esc(product.unit) : ""}</span>
                </div>
              </div>
            </td>
            <td>
              ${APP.esc(store.categoryName(product.categoryId))}
              ${product.subcategory ? `<div class="admin-topbar__sub">${APP.esc(product.subcategory)}</div>` : ""}
            </td>
            <td class="num">
              <strong>${APP.money(product.price)}</strong>
              ${product.oldPrice ? `<div class="admin-topbar__sub" style="text-decoration:line-through">${APP.money(product.oldPrice)}</div>` : ""}
            </td>
            <td>
              <form class="inline-stock" data-stock-form data-id="${product.id}">
                <label class="sr-only" for="stock-${product.id}">Stock de ${APP.esc(product.name)}</label>
                <input id="stock-${product.id}" type="number" name="stock" value="${product.stock}" min="0" max="99999">
                <button class="btn btn--sm btn--ghost" type="submit" title="Guardar stock">✓</button>
              </form>
              ${
                product.stock === 0
                  ? '<span class="badge badge--danger" style="margin-top:.3rem">Agotado</span>'
                  : product.stock <= APP.admin.LOW_STOCK
                  ? '<span class="badge badge--low" style="margin-top:.3rem">Stock bajo</span>'
                  : ""
              }
            </td>
            <td>
              <div style="display:flex;flex-direction:column;gap:.25rem;align-items:flex-start">
                ${product.active ? '<span class="badge badge--ok">Activo</span>' : '<span class="badge badge--out">Inactivo</span>'}
                ${product.onSale ? `<span class="badge badge--sale">-${product.discount}%</span>` : ""}
                ${product.featured ? '<span class="badge badge--featured">Destacado</span>' : ""}
              </div>
            </td>
            <td>
              <div class="row-actions">
                <a class="btn btn--sm btn--ghost" href="${APP.url("producto/" + product.id)}" title="Ver en la tienda">👁</a>
                <button class="btn btn--sm btn--ghost" data-action="toggle-featured" data-id="${product.id}" title="Destacar">★</button>
                <a class="btn btn--sm btn--ghost" href="${APP.url("admin/productos/" + product.id)}">Editar</a>
                <button class="btn btn--sm btn--danger" data-action="delete-product" data-id="${product.id}" data-name="${APP.esc(product.name)}">Eliminar</button>
              </div>
            </td>
          </tr>`
                )
                .join("")
            : `<tr><td colspan="6">${APP.ui.empty({
                icon: "📦",
                title: "No hay productos que coincidan",
                text: "Probá con otro término de búsqueda o creá un producto nuevo.",
                action: { href: APP.url("admin/productos/nuevo"), label: "+ Nuevo producto" },
              })}</td></tr>`
        }
      </tbody>
    </table>
  </div>
  ${pages > 1 ? `<div class="admin-card__foot">${APP.ui.pagination(current, pages)}</div>` : ""}
</div>`;

  return APP.ui.adminShell(inner, {
    title: "Productos",
    subtitle: `${items.length} producto${items.length === 1 ? "" : "s"} en el catálogo`,
    actions: `<a class="btn btn--sm" href="${APP.url("admin/productos/nuevo")}">+ Nuevo producto</a>`,
    active: "productos",
  });
};

/* --------------------------------------------------------- form producto -- */
APP.admin.productForm = function (id) {
  const store = APP.store;
  const product = id ? store.product(id) : null;
  if (id && !product) return APP.views.notFound();

  const value = product || { active: true, stock: 0, featured: false };
  const brands = store.brands();

  const inner = `
<form id="product-form" data-id="${product ? product.id : ""}">
  <div class="form-layout">
    <div class="admin-card">
      <div class="admin-card__body">
        <div class="form-section">
          <h3>Información general</h3>
          <div class="form-grid">
            <div class="field col-full">
              <label for="name">Nombre del producto *</label>
              <input id="name" name="name" value="${APP.esc(value.name || "")}" required minlength="3" maxlength="200">
            </div>
            <div class="field">
              <label for="brand">Marca *</label>
              <input id="brand" name="brand" value="${APP.esc(value.brand || "")}" required maxlength="120" list="brands">
              <datalist id="brands">${brands.map((b) => `<option value="${APP.esc(b)}"></option>`).join("")}</datalist>
            </div>
            <div class="field">
              <label for="sku">SKU ${product ? "" : "(opcional, se genera solo)"}</label>
              <input id="sku" name="sku" value="${APP.esc(value.sku || "")}" maxlength="40" placeholder="BRI-HOG-0001">
            </div>
            <div class="field">
              <label for="categoryId">Categoría *</label>
              <select id="categoryId" name="categoryId" required>
                <option value="">Seleccionar…</option>
                ${store.categories().map((c) => `<option value="${c.id}" ${value.categoryId === c.id ? "selected" : ""}>${APP.esc(c.name)}</option>`).join("")}
              </select>
            </div>
            <div class="field">
              <label for="subcategory">Subcategoría</label>
              <input id="subcategory" name="subcategory" value="${APP.esc(value.subcategory || "")}" maxlength="120" placeholder="Multiuso, Detergentes…">
            </div>
            <div class="field col-full">
              <label for="unit">Presentación</label>
              <input id="unit" name="unit" value="${APP.esc(value.unit || "")}" maxlength="40" placeholder="750 ml, 3 kg, 4 un.">
            </div>
            <div class="field col-full">
              <label for="description">Descripción *</label>
              <textarea id="description" name="description" required minlength="10" style="min-height:130px">${APP.esc(value.description || "")}</textarea>
              <span class="field-hint">Se muestra en la página del producto. Mínimo 10 caracteres.</span>
            </div>
          </div>
        </div>

        <div class="form-section" style="margin-bottom:0">
          <h3>Precio y stock</h3>
          <div class="form-grid">
            <div class="field">
              <label for="price">Precio de venta *</label>
              <input id="price" type="number" name="price" value="${value.price || ""}" required min="0.01" step="0.01">
            </div>
            <div class="field">
              <label for="oldPrice">Precio anterior (tachado)</label>
              <input id="oldPrice" type="number" name="oldPrice" value="${value.oldPrice || ""}" min="0" step="0.01">
              <span class="field-hint">Si es mayor al precio de venta, el producto pasa a oferta y el % se calcula solo.</span>
            </div>
            <div class="field col-full">
              <label for="stock">Stock disponible *</label>
              <input id="stock" type="number" name="stock" value="${value.stock || 0}" required min="0" step="1">
              <span class="field-hint">Con stock 0 el producto se muestra como «Sin stock» y no puede comprarse.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="admin-card" style="margin-bottom:1.25rem">
        <div class="admin-card__head"><h3>Vista previa</h3></div>
        <div class="admin-card__body">
          <div class="image-preview">
            ${
              product
                ? `<img src="${APP.images.product(product)}" alt="${APP.esc(product.name)}">`

            }

        </div>
      </div>

      <div class="admin-card" style="margin-bottom:1.25rem">
        <div class="admin-card__head"><h3>Visibilidad</h3></div>

          </label>
          <label class="switch-row">
            <input type="checkbox" name="featured" ${value.featured ? "checked" : ""}>

        </div>

  return APP.ui.adminShell(inner, {
    title: product ? "Editar producto" : "Nuevo producto",
    subtitle: product ? `${product.sku} · creado el ${APP.date(product.createdAt)}` : "Completá los datos del producto",
    actions: `<a class="btn btn--sm btn--ghost" href="${APP.url("admin/productos")}">← Volver al listado</a>`,
    active: "productos",

/* =========================================================================
   08 · Router, eventos e inicializacion
   Las rutas usan hash (#/productos?categoria=cocina) para que el archivo
   funcione tambien abierto con doble clic desde file://.
   ========================================================================= */

APP.router = {
  current: { path: "", segments: [], params: new URLSearchParams() },

  parse() {
    const raw = location.hash.replace(/^#\/?/, "");
    const [path, query] = raw.split("?");
    return {
      path: path || "",
      segments: (path || "").split("/").filter(Boolean),
      params: new URLSearchParams(query || ""),
    };
  },

  go(hash) {
    location.hash = hash.replace(/^#/, "");
  },

  resolve(route) {
    const [first, second, third] = route.segments;
    const params = route.params;

    // --- Panel de administracion ---------------------------------------
    if (first === "admin") {
      if (!APP.store.isAdmin()) return { html: APP.admin.denied(), admin: false };
      if (second === "productos") {
        if (third === "nuevo") return { html: APP.admin.productForm(null), admin: true };
        if (third) return { html: APP.admin.productForm(third), admin: true };
        return { html: APP.admin.products(params), admin: true };
      }
      if (second === "categorias") return { html: APP.admin.categories(), admin: true };
      if (second === "pedidos") {
        return { html: third ? APP.admin.orderDetail(third) : APP.admin.orders(params), admin: true };
      }
      if (second === "usuarios") return { html: APP.admin.users(params), admin: true };
      if (!second) return { html: APP.admin.dashboard(), admin: true };
      return { html: APP.views.notFound(), admin: false };
    }

    // --- Tienda ---------------------------------------------------------
    switch (first) {
      case undefined:
      case "":
        return { html: APP.views.home() };
      case "productos":
      case "buscar":
        return { html: APP.views.products(params) };
      case "producto":
        return { html: APP.views.product(second) };
      case "carrito":
        return { html: APP.views.cart() };
      case "checkout":
        return { html: APP.views.checkout() };
      case "pedido":
        return { html: APP.views.orderConfirmation(second) };
      case "ingresar":
        return { html: APP.store.currentUser() ? APP.views.home() : APP.views.login(params) };
      case "registro":
        return { html: APP.store.currentUser() ? APP.views.home() : APP.views.register() };
      case "mi-cuenta":
        return { html: APP.views.profile() };
      case "mis-pedidos":
        return { html: second ? APP.views.orderDetail(second) : APP.views.myOrders() };
      case "ayuda":
        return { html: APP.views.staticPage(second) };
      default:
        return { html: APP.views.notFound() };
    }
  },

  render() {
    this.current = this.parse();
    const result = this.resolve(this.current);
    if (result.html === "") return; // la vista redirigio por su cuenta

    const app = APP.$("#app");
    document.body.classList.toggle("admin-body", !!result.admin);

    app.innerHTML = result.admin
      ? result.html
      : `${APP.ui.header()}<main id="main" class="view-enter">${result.html}</main>${APP.ui.footer()}`;

    APP.behaviors.afterRender();
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  },
};

/* ---------------------------------------------------- comportamientos UI -- */
APP.behaviors = {
  /** Refresca el contador del carrito sin volver a dibujar la pagina. */
  paintCart() {
    const summary = APP.store.cartSummary();
    const badge = APP.$("#cart-count");
    if (badge) {
      badge.textContent = summary.units;
      badge.hidden = summary.units === 0;
      badge.classList.remove("is-bump");
      void badge.offsetWidth;
      badge.classList.add("is-bump");
    }
    const label = APP.$("#cart-total-label");
    if (label) label.textContent = APP.money(summary.productsTotal);
  },

  /** Se ejecuta despues de cada render: selectores de cantidad, filtros, buscador. */
  afterRender() {
    APP.behaviors.quantityWidgets();
    APP.behaviors.filtersDrawer();
    APP.behaviors.search();
    APP.behaviors.userMenu();
  },

  quantityWidgets() {
    APP.$$("[data-qty]").forEach((widget) => {
      const input = APP.$("input", widget);
      const max = Number(input.max || 99);
      const sync = () => {
        let value = parseInt(input.value, 10);
        if (isNaN(value) || value < 1) value = 1;
        if (value > max) {
          value = max;
          APP.toast(`Solo hay ${max} unidades disponibles.`, "info");
        }
        input.value = value;
        APP.$$("button", widget).forEach((btn) => {
          const step = Number(btn.dataset.step);
          btn.disabled = (step < 0 && value <= 1) || (step > 0 && value >= max);
        });
      };
      APP.$$("button", widget).forEach((btn) =>
        btn.addEventListener("click", () => {
          input.value = Number(input.value) + Number(btn.dataset.step);
          sync();
        })
      );
      input.addEventListener("change", sync);
      sync();
    });
  },

  filtersDrawer() {
    const filters = APP.$("#filters");
    const backdrop = APP.$("#filters-backdrop");
    if (!filters) return;
    const close = () => {
      filters.classList.remove("is-open");
      if (backdrop) backdrop.hidden = true;
      document.body.style.overflow = "";
    };
    APP.$$("[data-filters-open]").forEach((btn) =>
      btn.addEventListener("click", () => {
        filters.classList.add("is-open");
        if (backdrop) backdrop.hidden = false;
        document.body.style.overflow = "hidden";
      })
    );
    APP.$$("[data-filters-close]").forEach((btn) => btn.addEventListener("click", close));
    if (backdrop) backdrop.addEventListener("click", close);

    // Los checkbox y radios aplican los filtros al instante
    APP.$$("#filters-form input[type=radio], #filters-form input[type=checkbox]").forEach((input) =>
      input.addEventListener("change", () => APP.behaviors.applyFilters())
    );

    const form = APP.$("#filters-form");
    if (form) {
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        APP.behaviors.applyFilters();
      });
    }

    const sort = APP.$("#sort-select");
    if (sort) {
      sort.addEventListener("change", () => APP.router.go(APP.urlWith({ orden: sort.value, page: null })));
    }
  },

  /** Traduce el formulario de filtros a parametros de la URL. */
  applyFilters() {
    const form = APP.$("#filters-form");
    if (!form) return;
    const data = new FormData(form);
    const params = new URLSearchParams();

    const q = APP.router.current.params.get("q");
    if (q) params.set("q", q);
    const orden = APP.router.current.params.get("orden");
    if (orden) params.set("orden", orden);

    ["categoria", "subcategoria", "min", "max"].forEach((key) => {
      const value = (data.get(key) || "").toString().trim();
      if (value) params.set(key, value);
    });
    data.getAll("marca").forEach((brand) => params.append("marca", brand));
    if (data.get("oferta")) params.set("oferta", "1");
    if (data.get("stock")) params.set("stock", "1");

    APP.router.go(APP.url("productos", params));
  },

  search() {
    const form = APP.$("#search-form");
    if (!form) return;
    const input = APP.$("#search-input", form);
    const box = APP.$("#suggestions");
    let timer = null;

    const hide = () => {
      box.hidden = true;
      box.innerHTML = "";
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      hide();
      const term = input.value.trim();
      APP.router.go(APP.url("productos", term ? { q: term } : {}));
    });

    input.addEventListener("input", () => {
      clearTimeout(timer);
      const term = input.value.trim();
      if (term.length < 2) return hide();
      timer = setTimeout(() => {
        const data = APP.store.suggestions(term);
        if (!data.products.length && !data.categories.length) return hide();

        let html = "";
        if (data.categories.length) {
          html += '<div class="suggestions__group"><div class="suggestions__title">Categorías</div>';
          data.categories.forEach((c) => {
            html += `<a class="suggestion" href="${APP.url("productos", { categoria: c.slug })}"><span class="suggestion__name">${APP.esc(c.name)}</span></a>`;
          });
          html += "</div>";
        }
        if (data.products.length) {
          html += '<div class="suggestions__group"><div class="suggestions__title">Productos</div>';
          data.products.forEach((p) => {
            html +=
              `<a class="suggestion" href="${APP.url("producto/" + p.id)}">` +
              `<img src="${APP.images.product(p)}" alt="" loading="lazy">` +
              `<span><span class="suggestion__name">${APP.esc(p.name)}</span>` +
              `<span class="suggestion__meta">${APP.esc(p.brand)}</span></span>` +
              `<span class="suggestion__price">${APP.money(p.price)}</span></a>`;
          });
          html += "</div>";
        }
        box.innerHTML = html;
        box.hidden = false;
      }, 160);
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hide();
    });
    document.addEventListener("click", (event) => {
      if (!form.parentElement.contains(event.target)) hide();
    });
  },

  userMenu() {
    const menu = APP.$("#user-menu");
    if (!menu) return;
    const trigger = APP.$("[data-menu-trigger]", menu);
    const panel = APP.$("[data-menu-panel]", menu);
    trigger.addEventListener("click", (event) => {
      event.stopPropagation();
      panel.hidden = !panel.hidden;
      trigger.setAttribute("aria-expanded", String(!panel.hidden));
    });
    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target)) {
        panel.hidden = true;
        trigger.setAttribute("aria-expanded", "false");
      }
    });
  },
};

/* ------------------------------------------------------ eventos globales -- */
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target) return;
  const { action, id, name } = target.dataset;
  const store = APP.store;

  try {
    switch (action) {
      case "add-to-cart": {
        // En la ficha de producto respetamos el selector de cantidad
        const qtyInput = target.dataset.fromQty ? APP.$("#quantity") : null;
        const quantity = qtyInput ? parseInt(qtyInput.value, 10) || 1 : 1;
        const product = store.addToCart(Number(id), quantity);
        APP.behaviors.paintCart();
        APP.toast(`${product.name} se agregó al carrito.`, "success");
        break;
      }
      case "remove-line":
        store.removeFromCart(Number(id));
        APP.toast("Producto eliminado del carrito.", "info");
        APP.router.render();
        break;
      case "clear-cart":
        if (!confirm("¿Seguro que querés vaciar el carrito?")) return;
        store.clearCart();
        APP.toast("Vaciaste el carrito.", "info");
        APP.router.render();
        break;
      case "logout":
        store.logout();
        APP.toast("Cerraste sesión correctamente.", "info");
        APP.router.go(APP.url(""));
        APP.router.render();
        break;
      case "reset-demo":
        if (!confirm("Esto restaura el catálogo, los pedidos y las cuentas originales. ¿Continuar?")) return;
        store.reset();
        APP.toast("Datos de demostración restaurados.", "success");
        APP.router.render();
        break;
      case "toggle-featured": {
        const product = store.toggleFeatured(Number(id));
        APP.toast(`${product.name} ${product.featured ? "agregado a" : "quitado de"} destacados.`, "success");
        APP.router.render();
        break;
      }
      case "delete-product": {
        if (!confirm(`¿Eliminar «${name}»? Si tiene ventas asociadas se desactivará en lugar de borrarse.`)) return;
        const result = store.deleteProduct(Number(id));
        APP.toast(
          result.softDeleted
            ? `«${name}» tiene ventas asociadas: se desactivó para no romper el historial de pedidos.`
            : `Producto «${name}» eliminado.`,
          result.softDeleted ? "info" : "success"
        );
        APP.router.render();
        break;
      }
      case "delete-category":
        if (!confirm(`¿Eliminar la categoría «${name}»?`)) return;
        store.deleteCategory(Number(id));
        APP.toast("Categoría eliminada.", "success");
        APP.router.render();
        break;
    }
  } catch (error) {
    APP.toast(error.message, "error");
    if (["remove-line", "delete-product", "delete-category"].includes(action)) APP.router.render();
  }
});

/* Cambios de cantidad dentro del carrito */
document.addEventListener("click", (event) => {
  const stepper = event.target.closest("[data-qty-step]");
  if (!stepper) return;
  const line = stepper.closest("[data-cart-line]");
  const input = APP.$("input[name=quantity]", line);
  const next = Number(input.value) + Number(stepper.dataset.qtyStep);
  const max = Number(input.max || 99);
  if (next < 1) return;
  if (next > max) return APP.toast(`Solo hay ${max} unidades disponibles.`, "error");
  try {
    APP.store.setQuantity(Number(line.dataset.cartLine), next);
  } catch (error) {
    APP.toast(error.message, "error");
  }
  APP.router.render();
});

document.addEventListener("change", (event) => {
  const line = event.target.closest("[data-cart-line]");
  if (line && event.target.name === "quantity") {
    try {
      APP.store.setQuantity(Number(line.dataset.cartLine), event.target.value);
    } catch (error) {
      APP.toast(error.message, "error");
    }
    return APP.router.render();
  }

  const statusSelect = event.target.closest("[data-order-status]");
  if (statusSelect) {
    const order = APP.store.setOrderStatus(Number(statusSelect.dataset.id), statusSelect.value);
    APP.toast(`Pedido ${order.number}: estado «${APP.store.STATUS_LABELS[order.status]}».`, "success");
    return APP.router.render();
  }

  const roleSelect = event.target.closest("[data-user-role]");
  if (roleSelect) {
    try {
      const user = APP.store.setUserRole(Number(roleSelect.dataset.id), roleSelect.value);
      APP.toast(`${user.name} ahora es ${user.role === "admin" ? "administrador" : "cliente"}.`, "success");
    } catch (error) {
      APP.toast(error.message, "error");
    }
    return APP.router.render();
  }
});

/* ----------------------------------------------------------- formularios -- */
document.addEventListener("submit", (event) => {
  const form = event.target;
  const store = APP.store;
  const value = (name) => (new FormData(form).get(name) || "").toString().trim();

  const handlers = {
    "login-form": () => {
      const user = store.login(value("email"), value("password"));
      if (!user) return APP.toast("Email o contraseña incorrectos.", "error");
      APP.toast(`Hola de nuevo, ${user.name.split(" ")[0]}.`, "success");
      const next = value("next");
      APP.router.go(APP.url(next || (user.role === "admin" ? "admin" : "")));
      APP.router.render();
    },

    "register-form": () => {
      const errors = [];
      if (value("name").length < 3) errors.push("Ingresá tu nombre completo.");
      if (!APP.validEmail(value("email"))) errors.push("El email no tiene un formato válido.");
      if (value("password").length < 8) errors.push("La contraseña debe tener al menos 8 caracteres.");
      if (value("password") !== value("confirm")) errors.push("Las contraseñas no coinciden.");
      if (errors.length) return errors.forEach((message) => APP.toast(message, "error"));

      const user = store.register(value("name"), value("email"), value("password"));
      APP.toast(`Bienvenido/a, ${user.name.split(" ")[0]}. Tu cuenta está lista.`, "success");
      APP.router.go(APP.url(""));
      APP.router.render();
    },

    "checkout-form": () => {
      const required = {
        customerName: "Nombre y apellido", customerEmail: "Email", customerPhone: "Teléfono",
        street: "Calle", number: "Número", city: "Ciudad", state: "Provincia", zip: "Código postal",
      };
      const missing = Object.keys(required).filter((key) => !value(key));
      if (missing.length) return missing.forEach((key) => APP.toast(`Falta completar: ${required[key]}.`, "error"));
      if (!APP.validEmail(value("customerEmail"))) return APP.toast("El email no tiene un formato válido.", "error");

      const order = store.createOrder({
        customerName: value("customerName"), customerEmail: value("customerEmail"),
        customerPhone: value("customerPhone"), street: value("street"), number: value("number"),
        city: value("city"), state: value("state"), zip: value("zip"),
        paymentMethod: value("paymentMethod") || "transferencia", notes: value("notes"),
      });
      APP.toast("Recibimos tu pedido.", "success");
      APP.router.go(APP.url("pedido/" + order.number));
      APP.router.render();
    },

    "profile-form": () => {
      if (value("name").length < 3) return APP.toast("El nombre debe tener al menos 3 caracteres.", "error");
      store.updateProfile(value("name"), value("phone"));
      APP.toast("Datos actualizados.", "success");
      APP.router.render();
    },

    "password-form": () => {
      if (value("next").length < 8) return APP.toast("La nueva contraseña debe tener al menos 8 caracteres.", "error");
      if (value("next") !== value("confirm")) return APP.toast("Las contraseñas nuevas no coinciden.", "error");
      store.changePassword(value("current"), value("next"));
      APP.toast("Contraseña actualizada.", "success");
      form.reset();
    },

    "product-form": () => {
      const data = {
        name: value("name"),
        brand: value("brand"),
        categoryId: Number(value("categoryId")),
        subcategory: value("subcategory") || null,
        description: value("description"),
        price: Number(value("price")),
        oldPrice: value("oldPrice") ? Number(value("oldPrice")) : null,
        stock: parseInt(value("stock"), 10) || 0,
        sku: value("sku").toUpperCase(),
        unit: value("unit") || null,
        featured: !!new FormData(form).get("featured"),
        active: !!new FormData(form).get("active"),
      };

      const errors = [];
      if (data.name.length < 3) errors.push("El nombre debe tener al menos 3 caracteres.");
      if (!data.brand) errors.push("La marca es obligatoria.");
      if (!store.categories().some((c) => c.id === data.categoryId)) errors.push("Seleccioná una categoría válida.");
      if (!(data.price > 0)) errors.push("El precio debe ser mayor a cero.");
      if (data.oldPrice && data.oldPrice <= data.price) errors.push("El precio anterior debe ser mayor al precio actual.");
      if (data.description.length < 10) errors.push("La descripción debe tener al menos 10 caracteres.");
      if (errors.length) return errors.forEach((message) => APP.toast(message, "error"));

      const id = form.dataset.id ? Number(form.dataset.id) : null;
      const product = store.saveProduct(data, id);
      APP.toast(id ? "Producto actualizado." : `Producto "${product.name}" creado.`, "success");
      APP.router.go(APP.url("admin/productos"));
      APP.router.render();
    },

    "new-category-form": () => {
      store.saveCategory({
        name: value("name"),
        description: value("description"),
        icon: value("icon").slice(0, 8),
        position: parseInt(value("position"), 10) || 99,
      });
      APP.toast(`Categoría "${value("name")}" creada.`, "success");
      APP.router.render();
    },

    "admin-products-filter": () => APP.router.go(APP.url("admin/productos", new URLSearchParams(new FormData(form)))),
    "admin-orders-filter": () => APP.router.go(APP.url("admin/pedidos", new URLSearchParams(new FormData(form)))),
    "admin-users-filter": () => APP.router.go(APP.url("admin/usuarios", new URLSearchParams(new FormData(form)))),
  };

  let handler = handlers[form.id];

  // Formularios repetidos (uno por fila): stock rapido y edicion de categoria
  if (!handler && form.matches("[data-stock-form]")) {
    handler = () => {
      const product = store.setStock(Number(form.dataset.id), value("stock"));
      APP.toast(`Stock de ${product.name}: ${product.stock} unidades.`, "success");
      APP.router.render();
    };
  }
  if (!handler && form.matches("[data-category-form]")) {
    handler = () => {
      store.saveCategory(
        {
          name: value("name"),
          description: value("description"),
          icon: value("icon").slice(0, 8),
          position: parseInt(value("position"), 10) || 0,
        },
        Number(form.dataset.id)
      );
      APP.toast("Categoría actualizada.", "success");
      APP.router.render();
    };
  }

  if (!handler) return;
  event.preventDefault();
  try {
    handler();
  } catch (error) {
    APP.toast(error.message, "error");
  }
});

/* ------------------------------------------------------------- arranque -- */
window.addEventListener("hashchange", () => APP.router.render());

document.addEventListener("DOMContentLoaded", () => {
  const toTop = APP.$("#to-top");
  if (toTop) {
    const onScroll = () => toTop.classList.toggle("is-visible", window.scrollY > 600);
    window.addEventListener("scroll", onScroll, { passive: true });
    toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  }
  APP.router.render();
});

// Si el DOM ya estaba listo cuando se ejecuto el script (script al final del body)
if (document.readyState !== "loading") {
  APP.router.render();
}

</script>
</body>
</html>
