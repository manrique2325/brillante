/* =========================================================================
   Brillante - version de un solo archivo
   01 · Utilidades base: formato, escapado, hashing y helpers del DOM
   ========================================================================= */
"use strict";

const APP = {};

APP.$ = (sel, ctx = document) => ctx.querySelector(sel);
APP.$$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

/* --------------------------------------------------------------- formato -- */
APP.money = function (value) {
  const number = Number(value || 0);
  const [entero, decimales] = number.toFixed(2).split(".");
  return "$ " + entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + decimales;
};

APP.date = function (iso) {
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
};

APP.dateTime = function (iso) {
  const d = new Date(iso);
  return `${APP.date(iso)} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
};

APP.dayLabel = function (date) {
  return `${String(date.getDate()).padStart(2, "0")}/${String(date.getMonth() + 1).padStart(2, "0")}`;
};

/** Escapa texto antes de interpolarlo en HTML (equivalente al autoescape de Jinja). */
APP.esc = function (text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
};

APP.slugify = function (value) {
  return (
    String(value || "")
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .toLowerCase() || "item"
  );
};

APP.normalize = function (text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase();
};

APP.validEmail = function (value) {
  return /^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(String(value || "").trim());
};

APP.clamp = function (value, min, max) {
  value = parseInt(value, 10);
  if (isNaN(value)) value = min;
  return Math.min(Math.max(value, min), max);
};

/* ------------------------------------------------------------- SHA-256 --- */
/* Implementacion compacta de dominio publico (basada en la de geraintluff).
   Se usa en lugar de crypto.subtle porque este archivo debe funcionar tambien
   abierto con doble clic desde file://, sin servidor. */
APP.sha256 = function (message) {
  const bytes = new TextEncoder().encode(message);
  let ascii = "";
  bytes.forEach((b) => (ascii += String.fromCharCode(b)));

  const rightRotate = (value, amount) => (value >>> amount) | (value << (32 - amount));
  const maxWord = Math.pow(2, 32);
  let result = "";
  const words = [];
  const asciiBitLength = ascii.length * 8;

  const hashSeed = [];
  const k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hashSeed[primeCounter] = (Math.pow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }

  ascii += "\x80";
  while (ascii.length % 64 !== 56) ascii += "\x00";
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return "";
    words[i >> 2] |= j << (((3 - i) % 4) * 8);
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;

  let hash = hashSeed.slice(0, 8);
  for (let j = 0; j < words.length; ) {
    const w = words.slice(j, (j += 16));
    const oldHash = hash;
    hash = hash.slice(0, 8);

    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15];
      const w2 = w[i - 2];
      const a = hash[0];
      const e = hash[4];
      const temp1 =
        hash[7] +
        (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
        ((e & hash[5]) ^ (~e & hash[6])) +
        k[i] +
        (w[i] =
          i < 16
            ? w[i]
            : (w[i - 16] +
                (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
                w[i - 7] +
                (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) |
              0);
      const temp2 =
        (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
        ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }

  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? "0" : "") + b.toString(16);
    }
  }
  return result;
};

/* ---------------------------------------------------------------- toasts -- */
APP.toast = function (message, type = "success") {
  const host = APP.$("#toasts");
  if (!host || !message) return;
  const icons = { success: "✓", error: "!", info: "i" };
  const el = document.createElement("div");
  el.className = `toast toast--${type}`;
  el.setAttribute("role", type === "error" ? "alert" : "status");
  el.innerHTML =
    `<span class="toast__icon">${icons[type] || "✓"}</span>` +
    `<span class="toast__text"></span>` +
    `<button class="toast__close" aria-label="Cerrar">×</button>`;
  APP.$(".toast__text", el).textContent = message;
  host.appendChild(el);

  const dismiss = () => {
    el.classList.add("is-out");
    setTimeout(() => el.remove(), 250);
  };
  APP.$(".toast__close", el).addEventListener("click", dismiss);
  setTimeout(dismiss, 4200);
};


/* =========================================================================
   02 · Imagenes de producto generadas en el navegador
   Puerto de app/product_images.py: misma logica de formas y paletas, pero el
   SVG se arma al vuelo y se entrega como data URI. Asi el archivo no carga con
   160 imagenes embebidas y ninguna imagen puede "romperse".
   ========================================================================= */

APP.images = (function () {
  const PALETTES = [
    ["#e6f4f1", "#0f9d8f", "#0b6b62"],
    ["#e8f0fe", "#2f6fed", "#1b46a8"],
    ["#fdeef2", "#e04f7a", "#a92e52"],
    ["#fff4e5", "#f59f28", "#b96f0c"],
    ["#eef1fb", "#6c63c7", "#443c96"],
    ["#eaf7ea", "#3faa54", "#26773a"],
    ["#fef2e8", "#e2703a", "#a94a20"],
    ["#eef7fb", "#2aa3c7", "#146e8b"],
    ["#f4eefb", "#8f56c9", "#5f3193"],
    ["#fdf0ec", "#d8543f", "#9c3524"],
  ];

  const SHAPES = {
    bottle: ["detergente", "lavandina", "suavizante", "jabon liquido", "limpiador", "limpiapiso",
             "desengrasante", "quitamancha", "jabon", "liquido", "cera", "shampoo"],
    spray: ["aromatizante", "desinfectante", "limpiavidrio", "spray", "aerosol", "perfume",
            "antigrasa", "sanitizante"],
    box: ["polvo", "jabon en polvo", "caja", "pastilla", "bolsa", "residuo", "detergente en polvo"],
    roll: ["papel", "rollo", "servilleta", "toalla", "higienico"],
    tool: ["escoba", "mopa", "secador", "cepillo", "balde", "palo", "plumero", "recogedor"],
    soft: ["esponja", "guante", "trapo", "rejilla", "panio", "franela", "fibra", "microfibra"],
  };

  const cache = new Map();

  /** Hash determinista (djb2): misma entrada, misma paleta. */
  function hash(text) {
    let h = 5381;
    const value = APP.normalize(text);
    for (let i = 0; i < value.length; i++) h = ((h << 5) + h + value.charCodeAt(i)) >>> 0;
    return h;
  }

  function pickShape(name, subcategory) {
    const haystack = APP.normalize(`${subcategory || ""} ${name}`);
    for (const shape of Object.keys(SHAPES)) {
      if (SHAPES[shape].some((keyword) => haystack.includes(keyword))) return shape;
    }
    return "bottle";
  }

  function labelLines(text, maxChars = 16, maxLines = 2) {
    const words = String(text || "").split(/\s+/);
    const lines = [];
    let current = "";
    for (const word of words) {
      const candidate = `${current} ${word}`.trim();
      if (candidate.length <= maxChars) {
        current = candidate;
      } else {
        if (current) lines.push(current);
        current = word;
      }
      if (lines.length === maxLines) break;
    }
    if (current && lines.length < maxLines) lines.push(current);
    return lines.slice(0, maxLines);
  }

  function body(shape, main, accent, light) {
    switch (shape) {
      case "spray":
        return `
  <path d="M188 118h58v22h-58z" fill="${accent}"/>
  <path d="M170 96h44v26h-44z" fill="${accent}" opacity=".85"/>
  <rect x="176" y="132" width="88" height="24" rx="8" fill="${accent}"/>
  <rect x="164" y="150" width="112" height="180" rx="26" fill="${main}"/>
  <rect x="180" y="196" width="80" height="76" rx="10" fill="${light}" opacity=".92"/>
  <rect x="176" y="160" width="20" height="150" rx="10" fill="#ffffff" opacity=".22"/>`;
      case "box":
        return `
  <path d="M132 150l88-32 88 32v168l-88 32-88-32z" fill="${main}"/>
  <path d="M220 118l88 32v168l-88 32z" fill="${accent}" opacity=".9"/>
  <path d="M132 150l88 32v168l-88-32z" fill="#000000" opacity=".08"/>
  <rect x="156" y="196" width="128" height="86" rx="10" fill="${light}" opacity=".95"/>`;
      case "roll":
        return `
  <rect x="140" y="140" width="160" height="190" rx="18" fill="${main}"/>
  <ellipse cx="220" cy="140" rx="80" ry="26" fill="${light}"/>
  <ellipse cx="220" cy="140" rx="30" ry="10" fill="${accent}"/>
  <rect x="152" y="150" width="18" height="170" rx="9" fill="#ffffff" opacity=".22"/>
  <rect x="168" y="214" width="104" height="62" rx="10" fill="${light}" opacity=".92"/>`;
      case "tool":
        return `
  <rect x="208" y="70" width="24" height="200" rx="12" fill="${accent}"/>
  <rect x="150" y="262" width="140" height="42" rx="12" fill="${main}"/>
  <path d="M154 304h132l-12 56h-108z" fill="${accent}" opacity=".9"/>
  <rect x="212" y="86" width="8" height="170" rx="4" fill="#ffffff" opacity=".28"/>`;
      case "soft":
        return `
  <rect x="128" y="168" width="184" height="120" rx="26" fill="${main}"/>
  <rect x="128" y="168" width="184" height="46" rx="22" fill="${light}"/>
  <circle cx="176" cy="252" r="10" fill="#ffffff" opacity=".35"/>
  <circle cx="220" cy="262" r="8" fill="#ffffff" opacity=".3"/>
  <circle cx="262" cy="248" r="11" fill="#ffffff" opacity=".28"/>`;
      default:
        return `
  <rect x="196" y="92" width="48" height="34" rx="8" fill="${accent}"/>
  <path d="M198 126h44l26 34v10h-96v-10z" fill="${accent}" opacity=".85"/>
  <rect x="150" y="168" width="140" height="176" rx="30" fill="${main}"/>
  <rect x="172" y="212" width="96" height="82" rx="12" fill="${light}" opacity=".95"/>
  <rect x="163" y="186" width="22" height="140" rx="11" fill="#ffffff" opacity=".22"/>`;
    }
  }

  function buildSvg(product) {
    const seed = product.sku || `${product.brand}${product.name}`;
    const [background, main, accent] = PALETTES[hash(seed) % PALETTES.length];
    const shape = pickShape(product.name, product.subcategory);
    const lines = labelLines(product.name);

    let y = lines.length > 1 ? 244 : 252;
    let text = "";
    for (const line of lines) {
      text += `\n  <text x="220" y="${y}" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="${accent}">${APP.esc(line)}</text>`;
      y += 20;
    }
    if (product.brand) {
      text += `\n  <text x="220" y="${y + 2}" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.6" fill="${main}">${APP.esc(product.brand.toUpperCase().slice(0, 18))}</text>`;
    }

    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <rect width="440" height="440" fill="${background}"/>
  <circle cx="352" cy="88" r="66" fill="${main}" opacity=".13"/>
  <circle cx="78" cy="368" r="52" fill="${accent}" opacity=".10"/>
  <ellipse cx="220" cy="374" rx="118" ry="16" fill="${accent}" opacity=".14"/>${body(shape, main, accent, "#ffffff")}${text}
</svg>`;
  }

  function toDataUri(svg) {
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  return {
    /** Imagen del producto (memoizada por SKU). */
    product(product) {
      const key = product.sku || `p${product.id}`;
      if (!cache.has(key)) cache.set(key, toDataUri(buildSvg(product)));
      return cache.get(key);
    },

    /** Portada de categoria. */
    category(category) {
      const key = `cat:${category.slug}`;
      if (!cache.has(key)) {
        const [background, main, accent] = PALETTES[hash(category.name) % PALETTES.length];
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs><linearGradient id="g${hash(category.slug)}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="${background}"/><stop offset="100%" stop-color="${main}" stop-opacity=".35"/>
  </linearGradient></defs>
  <rect width="400" height="300" fill="url(#g${hash(category.slug)})"/>
  <circle cx="330" cy="66" r="70" fill="${main}" opacity=".18"/>
  <circle cx="64" cy="250" r="48" fill="${accent}" opacity=".14"/>
  <text x="200" y="168" text-anchor="middle" font-size="76">${APP.esc(category.icon || "")}</text>
</svg>`;
        cache.set(key, toDataUri(svg));
      }
      return cache.get(key);
    },
  };
})();


/* =========================================================================
   03 · Estado y reglas de negocio
   Equivalente en el navegador de models.py + services.py. El estado completo
   (catalogo, usuarios, pedidos, carrito y sesion) vive en localStorage bajo una
   sola clave, y se siembra la primera vez desde los datos embebidos.
   ========================================================================= */

APP.store = (function () {
  const KEY = "brillante.v1";
  const SEED = window.BRILLANTE_DATA;

  const STATUSES = ["pendiente", "confirmado", "preparando", "enviado", "entregado", "cancelado"];
  const STATUS_LABELS = {
    pendiente: "Pendiente",
    confirmado: "Confirmado",
    preparando: "Preparando",
    enviado: "Enviado",
    entregado: "Entregado",
    cancelado: "Cancelado",
  };
  const PAYMENT_METHODS = {
    transferencia: "Transferencia bancaria",
    tarjeta: "Tarjeta de crédito/débito",
    efectivo: "Efectivo al recibir",
  };

  let state = null;

  function fresh() {
    const data = JSON.parse(JSON.stringify(SEED));
    return {
      version: 1,
      products: data.products,
      categories: data.categories,
      users: data.users,
      orders: data.orders,
      cart: [], // [{productId, quantity}]
      sessionUserId: null,
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.version === 1 && Array.isArray(parsed.products)) return parsed;
      }
    } catch (err) {
      /* localStorage bloqueado o datos corruptos: arrancamos de cero */
    }
    return fresh();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (err) {
      APP.toast("No pudimos guardar los cambios: el navegador bloquea el almacenamiento.", "error");
    }
  }

  function nextId(collection) {
    return collection.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;
  }

  state = load();

  /* ------------------------------------------------------------- lectura -- */
  const api = {
    STATUSES,
    STATUS_LABELS,
    PAYMENT_METHODS,
    config: SEED.config,

    get state() {
      return state;
    },
    save,

    reset() {
      state = fresh();
      save();
    },

    categories() {
      return state.categories.slice().sort((a, b) => a.position - b.position || a.name.localeCompare(b.name));
    },
    category(idOrSlug) {
      return state.categories.find((c) => c.slug === idOrSlug || c.id === Number(idOrSlug)) || null;
    },
    categoryName(id) {
      const found = state.categories.find((c) => c.id === id);
      return found ? found.name : "—";
    },

    products() {
      return state.products;
    },
    activeProducts() {
      return state.products.filter((p) => p.active);
    },
    product(id) {
      return state.products.find((p) => p.id === Number(id)) || null;
    },
    brands(categorySlug) {
      const category = categorySlug ? api.category(categorySlug) : null;
      const list = api
        .activeProducts()
        .filter((p) => !category || p.categoryId === category.id)
        .map((p) => p.brand);
      return Array.from(new Set(list)).sort((a, b) => a.localeCompare(b));
    },
    subcategories(categoryId) {
      const list = api
        .activeProducts()
        .filter((p) => p.categoryId === categoryId && p.subcategory)
        .map((p) => p.subcategory);
      return Array.from(new Set(list)).sort((a, b) => a.localeCompare(b));
    },
    priceBounds() {
      const prices = api.activeProducts().map((p) => p.price);
      return prices.length ? [Math.min(...prices), Math.max(...prices)] : [0, 0];
    },
    countIn(categoryId) {
      return api.activeProducts().filter((p) => p.categoryId === categoryId).length;
    },
    isNew(product) {
      return (Date.now() - new Date(product.createdAt).getTime()) / 86400000 <= 30;
    },

    /* --------------------------------------------------------- busqueda -- */
    /** Filtra, ordena y pagina el catalogo. Espejo de build_product_query(). */
    search(params) {
      const filters = {
        q: (params.get("q") || "").trim(),
        categoria: params.get("categoria") || "",
        subcategoria: params.get("subcategoria") || "",
        marca: params.getAll("marca").filter(Boolean),
        min: params.get("min") ? Number(params.get("min")) : null,
        max: params.get("max") ? Number(params.get("max")) : null,
        oferta: params.get("oferta") === "1",
        stock: params.get("stock") === "1",
        orden: params.get("orden") || "relevancia",
        page: Math.max(1, parseInt(params.get("page") || "1", 10) || 1),
      };

      let items = api.activeProducts();

      if (filters.q) {
        const term = APP.normalize(filters.q);
        items = items.filter((p) => {
          const haystack = APP.normalize(
            [p.name, p.brand, p.sku, p.subcategory, p.description, api.categoryName(p.categoryId)].join(" ")
          );
          return haystack.includes(term);
        });
      }
      if (filters.categoria) {
        const category = api.category(filters.categoria);
        items = category ? items.filter((p) => p.categoryId === category.id) : [];
      }
      if (filters.subcategoria) items = items.filter((p) => p.subcategory === filters.subcategoria);
      if (filters.marca.length) items = items.filter((p) => filters.marca.includes(p.brand));
      if (filters.min !== null && !isNaN(filters.min)) items = items.filter((p) => p.price >= filters.min);
      if (filters.max !== null && !isNaN(filters.max)) items = items.filter((p) => p.price <= filters.max);
      if (filters.oferta) items = items.filter((p) => p.onSale);
      if (filters.stock) items = items.filter((p) => p.stock > 0);

      const sorters = {
        precio_asc: (a, b) => a.price - b.price,
        precio_desc: (a, b) => b.price - a.price,
        nuevos: (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
        ofertas: (a, b) => b.discount - a.discount || a.price - b.price,
        nombre: (a, b) => a.name.localeCompare(b.name),
        relevancia: (a, b) =>
          (b.stock > 0) - (a.stock > 0) || b.featured - a.featured || b.discount - a.discount || a.id - b.id,
      };
      items = items.slice().sort(sorters[filters.orden] || sorters.relevancia);

      const perPage = api.config.perPage;
      const pages = Math.max(1, Math.ceil(items.length / perPage));
      const page = Math.min(filters.page, pages);
      return {
        filters,
        total: items.length,
        page,
        pages,
        items: items.slice((page - 1) * perPage, page * perPage),
      };
    },

    related(product, limit = 5) {
      const same = api
        .activeProducts()
        .filter((p) => p.id !== product.id && p.categoryId === product.categoryId);
      const primary = same.filter((p) => p.subcategory === product.subcategory);
      const rest = same.filter((p) => p.subcategory !== product.subcategory);
      return primary.concat(rest).slice(0, limit);
    },

    suggestions(term) {
      const needle = APP.normalize(term);
      if (needle.length < 2) return { products: [], categories: [] };
      return {
        products: api
          .activeProducts()
          .filter((p) => APP.normalize(`${p.name} ${p.brand} ${p.sku}`).includes(needle))
          .sort((a, b) => b.featured - a.featured || a.name.localeCompare(b.name))
          .slice(0, 6),
        categories: api.categories().filter((c) => APP.normalize(c.name).includes(needle)).slice(0, 3),
      };
    },

    /* ---------------------------------------------------------- sesion -- */
    currentUser() {
      return state.users.find((u) => u.id === state.sessionUserId) || null;
    },
    isAdmin() {
      const user = api.currentUser();
      return !!user && user.role === "admin";
    },
    login(email, password) {
      const user = state.users.find((u) => u.email === String(email || "").trim().toLowerCase());
      if (!user || user.passwordHash !== APP.sha256(password)) return null;
      state.sessionUserId = user.id;
      save();
      return user;
    },
    logout() {
      state.sessionUserId = null;
      save();
    },
    register(name, email, password) {
      email = String(email || "").trim().toLowerCase();
      if (state.users.some((u) => u.email === email)) throw new Error("Ya existe una cuenta con ese email.");
      const user = {
        id: nextId(state.users),
        name: String(name).trim(),
        email,
        role: "customer",
        phone: null,
        createdAt: new Date().toISOString(),
        passwordHash: APP.sha256(password),
      };
      state.users.push(user);
      state.sessionUserId = user.id;
      save();
      return user;
    },
    updateProfile(name, phone) {
      const user = api.currentUser();
      if (!user) return;
      user.name = name;
      user.phone = phone || null;
      save();
    },
    changePassword(current, next) {
      const user = api.currentUser();
      if (!user) throw new Error("No hay sesión activa.");
      if (user.passwordHash !== APP.sha256(current)) throw new Error("La contraseña actual no es correcta.");
      user.passwordHash = APP.sha256(next);
      save();
    },

    /* ---------------------------------------------------------- carrito -- */
    cartItems() {
      return state.cart
        .map((line) => {
          const product = api.product(line.productId);
          return product ? { product, quantity: line.quantity, lineTotal: product.price * line.quantity } : null;
        })
        .filter(Boolean);
    },

    cartSummary() {
      const items = api.cartItems();
      const threshold = api.config.freeShipping;
      if (!items.length) {
        return {
          units: 0, subtotal: 0, discount: 0, shipping: 0, total: 0, productsTotal: 0,
          freeShipping: false, missingForFree: threshold,
        };
      }
      const units = items.reduce((sum, i) => sum + i.quantity, 0);
      const subtotal = items.reduce((sum, i) => sum + (i.product.oldPrice || i.product.price) * i.quantity, 0);
      const productsTotal = items.reduce((sum, i) => sum + i.lineTotal, 0);
      const shipping = productsTotal >= threshold ? 0 : api.config.shippingCost;
      return {
        units,
        subtotal: Math.round(subtotal * 100) / 100,
        discount: Math.round((subtotal - productsTotal) * 100) / 100,
        shipping,
        productsTotal: Math.round(productsTotal * 100) / 100,
        total: Math.round((productsTotal + shipping) * 100) / 100,
        freeShipping: shipping === 0,
        missingForFree: Math.max(0, Math.round((threshold - productsTotal) * 100) / 100),
      };
    },

    addToCart(productId, quantity = 1) {
      const product = api.product(productId);
      if (!product || !product.active) throw new Error("El producto no está disponible.");
      if (product.stock <= 0) throw new Error(`${product.name} está sin stock.`);

      const line = state.cart.find((l) => l.productId === product.id);
      const desired = (line ? line.quantity : 0) + APP.clamp(quantity, 1, product.stock);
      const finalQty = Math.min(desired, product.stock);

      if (line) line.quantity = finalQty;
      else state.cart.push({ productId: product.id, quantity: finalQty });
      save();

      if (desired > product.stock) {
        throw new Error(`Solo quedan ${product.stock} unidades de ${product.name}; ajustamos la cantidad.`);
      }
      return product;
    },

    setQuantity(productId, quantity) {
      const product = api.product(productId);
      const index = state.cart.findIndex((l) => l.productId === Number(productId));
      if (index < 0 || !product) throw new Error("Ese producto no está en tu carrito.");

      quantity = parseInt(quantity, 10) || 0;
      if (quantity <= 0) {
        state.cart.splice(index, 1);
        save();
        return;
      }
      if (quantity > product.stock) {
        state.cart[index].quantity = product.stock;
        save();
        throw new Error(`Solo hay ${product.stock} unidades disponibles.`);
      }
      state.cart[index].quantity = quantity;
      save();
    },

    removeFromCart(productId) {
      state.cart = state.cart.filter((l) => l.productId !== Number(productId));
      save();
    },

    clearCart() {
      state.cart = [];
      save();
    },

    /** Ajusta el carrito al stock real. Devuelve los avisos generados. */
    validateCart() {
      const problems = [];
      state.cart = state.cart.filter((line) => {
        const product = api.product(line.productId);
        if (!product || !product.active) {
          problems.push("Quitamos un producto que ya no está disponible.");
          return false;
        }
        if (product.stock <= 0) {
          problems.push(`${product.name} se quedó sin stock y lo quitamos del carrito.`);
          return false;
        }
        if (line.quantity > product.stock) {
          problems.push(`Ajustamos ${product.name} a ${product.stock} unidades.`);
          line.quantity = product.stock;
        }
        return true;
      });
      if (problems.length) save();
      return problems;
    },

    /* ---------------------------------------------------------- pedidos -- */
    orderNumber() {
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
      let number;
      do {
        number = `BRI-${stamp}-${Math.floor(1000 + Math.random() * 9000)}`;
      } while (state.orders.some((o) => o.number === number));
      return number;
    },

    createOrder(form) {
      const items = api.cartItems();
      if (!items.length) throw new Error("Tu carrito está vacío.");
      const problems = api.validateCart();
      if (problems.length) throw new Error(problems.join(" "));

      const user = api.currentUser();
      const totals = api.cartSummary();
      const order = {
        id: nextId(state.orders),
        number: api.orderNumber(),
        userId: user.id,
        status: "pendiente",
        subtotal: totals.subtotal,
        discount: totals.discount,
        shipping: totals.shipping,
        total: totals.total,
        customerName: form.customerName,
        customerEmail: form.customerEmail,
        customerPhone: form.customerPhone,
        address: {
          street: form.street, number: form.number, city: form.city,
          state: form.state, zip: form.zip,
        },
        paymentMethod: form.paymentMethod,
        notes: form.notes || null,
        createdAt: new Date().toISOString(),
        items: items.map((i) => ({
          productId: i.product.id,
          name: i.product.name,
          sku: i.product.sku,
          quantity: i.quantity,
          price: i.product.price,
          listPrice: i.product.oldPrice || i.product.price,
        })),
      };

      // Descuento de stock y vaciado del carrito
      items.forEach((i) => {
        i.product.stock = Math.max(0, i.product.stock - i.quantity);
      });
      state.orders.push(order);
      state.cart = [];
      if (user && !user.phone && form.customerPhone) user.phone = form.customerPhone;
      save();
      return order;
    },

    orders(userId) {
      const list = userId ? state.orders.filter((o) => o.userId === userId) : state.orders.slice();
      return list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    },
    order(number) {
      return state.orders.find((o) => o.number === number) || null;
    },
    orderById(id) {
      return state.orders.find((o) => o.id === Number(id)) || null;
    },
    orderUnits(order) {
      return order.items.reduce((sum, i) => sum + i.quantity, 0);
    },
    fullAddress(order) {
      const a = order.address || {};
      return [`${a.street || ""} ${a.number || ""}`.trim(), a.city, a.state, a.zip].filter(Boolean).join(", ");
    },

    setOrderStatus(id, status) {
      const order = api.orderById(id);
      if (!order || !STATUSES.includes(status)) return null;
      const previous = order.status;

      if (status === "cancelado" && previous !== "cancelado") {
        order.items.forEach((i) => {
          const product = api.product(i.productId);
          if (product) product.stock += i.quantity;
        });
      } else if (previous === "cancelado" && status !== "cancelado") {
        order.items.forEach((i) => {
          const product = api.product(i.productId);
          if (product) product.stock = Math.max(0, product.stock - i.quantity);
        });
      }

      order.status = status;
      order.updatedAt = new Date().toISOString();
      save();
      return order;
    },

    /* ------------------------------------------------------- admin CRUD -- */
    saveProduct(data, id) {
      const existing = id ? api.product(id) : null;
      if (!existing && data.sku && state.products.some((p) => p.sku === data.sku)) {
        throw new Error("Ya existe un producto con ese SKU.");
      }
      if (existing && data.sku && state.products.some((p) => p.sku === data.sku && p.id !== existing.id)) {
        throw new Error("Ya existe otro producto con ese SKU.");
      }

      const product = existing || {
        id: nextId(state.products),
        createdAt: new Date().toISOString(),
      };
      Object.assign(product, data);
      if (!product.sku) product.sku = `BRI-${String(state.products.length + 1).padStart(5, "0")}`;

      // Descuento y oferta derivados del precio anterior
      if (product.oldPrice && product.oldPrice > product.price) {
        product.discount = Math.round((1 - product.price / product.oldPrice) * 100);
        product.onSale = true;
      } else {
        product.oldPrice = null;
        product.discount = 0;
        product.onSale = false;
      }

      if (!existing) state.products.push(product);
      save();
      return product;
    },

    deleteProduct(id) {
      const product = api.product(id);
      if (!product) return null;
      const sold = state.orders.some((o) => o.items.some((i) => i.productId === product.id));
      if (sold) {
        // Baja logica: preserva el historial de pedidos.
        product.active = false;
        product.featured = false;
        save();
        return { product, softDeleted: true };
      }
      state.products = state.products.filter((p) => p.id !== product.id);
      state.cart = state.cart.filter((l) => l.productId !== product.id);
      save();
      return { product, softDeleted: false };
    },

    toggleFeatured(id) {
      const product = api.product(id);
      if (!product) return null;
      product.featured = !product.featured;
      save();
      return product;
    },

    setStock(id, stock) {
      const product = api.product(id);
      if (!product) return null;
      product.stock = Math.max(0, parseInt(stock, 10) || 0);
      save();
      return product;
    },

    saveCategory(data, id) {
      const existing = id ? state.categories.find((c) => c.id === Number(id)) : null;
      const duplicate = state.categories.some(
        (c) => c.name.toLowerCase() === data.name.toLowerCase() && (!existing || c.id !== existing.id)
      );
      if (duplicate) throw new Error("Ya existe una categoría con ese nombre.");

      const category = existing || { id: nextId(state.categories) };
      Object.assign(category, data);
      category.slug = APP.slugify(data.name);
      if (!existing) state.categories.push(category);
      save();
      return category;
    },

    deleteCategory(id) {
      const category = state.categories.find((c) => c.id === Number(id));
      if (!category) return null;
      const count = state.products.filter((p) => p.categoryId === category.id).length;
      if (count) throw new Error(`No se puede eliminar "${category.name}": tiene ${count} productos.`);
      state.categories = state.categories.filter((c) => c.id !== category.id);
      save();
      return category;
    },

    setUserRole(id, role) {
      const user = state.users.find((u) => u.id === Number(id));
      if (!user || !["customer", "admin"].includes(role)) return null;
      if (user.id === state.sessionUserId) throw new Error("No podés cambiar tu propio rol.");
      user.role = role;
      save();
      return user;
    },

    /* -------------------------------------------------- metricas admin -- */
    stats() {
      const valid = state.orders.filter((o) => o.status !== "cancelado");
      const revenue = valid.reduce((sum, o) => sum + o.total, 0);
      return {
        revenue: Math.round(revenue * 100) / 100,
        orders: state.orders.length,
        pending: state.orders.filter((o) => o.status === "pendiente").length,
        users: state.users.filter((u) => u.role === "customer").length,
        products: api.activeProducts().length,
        outOfStock: api.activeProducts().filter((p) => p.stock === 0).length,
        avgTicket: Math.round((revenue / Math.max(valid.length, 1)) * 100) / 100,
      };
    },

    salesChart(days = 14) {
      const buckets = [];
      for (let i = days - 1; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        buckets.push({ label: APP.dayLabel(date), value: 0 });
      }
      state.orders
        .filter((o) => o.status !== "cancelado")
        .forEach((order) => {
          const label = APP.dayLabel(new Date(order.createdAt));
          const bucket = buckets.find((b) => b.label === label);
          if (bucket) bucket.value += order.total;
        });
      return buckets.map((b) => ({ label: b.label, value: Math.round(b.value * 100) / 100 }));
    },

    topProducts(limit = 6) {
      const totals = new Map();
      state.orders
        .filter((o) => o.status !== "cancelado")
        .forEach((order) =>
          order.items.forEach((item) => {
            const entry = totals.get(item.name) || { name: item.name, units: 0, revenue: 0 };
            entry.units += item.quantity;
            entry.revenue += item.quantity * item.price;
            totals.set(item.name, entry);
          })
        );
      return Array.from(totals.values()).sort((a, b) => b.units - a.units).slice(0, limit);
    },

    statusCounts() {
      const counts = {};
      STATUSES.forEach((s) => (counts[s] = 0));
      state.orders.forEach((o) => (counts[o.status] = (counts[o.status] || 0) + 1));
      return counts;
    },

    lowStock(threshold = 8, limit = 10) {
      return api
        .activeProducts()
        .filter((p) => p.stock <= threshold)
        .sort((a, b) => a.stock - b.stock)
        .slice(0, limit);
    },

    userStats(userId) {
      const list = state.orders.filter((o) => o.userId === userId);
      return {
        count: list.length,
        spent: list.filter((o) => o.status !== "cancelado").reduce((sum, o) => sum + o.total, 0),
      };
    },
  };

  return api;
})();

APP.ui = {};

/** Construye una URL de hash conservando/alterando parametros. */
APP.url = function (path, params) {
  const query = params instanceof URLSearchParams ? params.toString() : new URLSearchParams(params || {}).toString();
  return `#/${path}${query ? "?" + query : ""}`;
};

/** URL de la vista actual cambiando parametros (null para quitarlos). */
APP.urlWith = function (changes) {
  const route = APP.router.current;
  const params = new URLSearchParams(route.params.toString());
  Object.keys(changes).forEach((key) => {
    const value = changes[key];
    if (value === null || value === undefined) params.delete(key);
    else if (Array.isArray(value)) {
      params.delete(key);
      value.forEach((v) => params.append(key, v));
    } else params.set(key, value);
  });
  return APP.url(route.path, params);
};

APP.ui.pagination = function (page, pages) {
  if (pages <= 1) return "";
  const numbers = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 1) numbers.push(i);
    else if (numbers[numbers.length - 1] !== null) numbers.push(null);
  }
  return `
<nav class="pagination" aria-label="Paginación">
  ${page > 1 ? `<a href="${APP.urlWith({ page: page - 1 })}" aria-label="Anterior">‹</a>` : '<span class="is-disabled">‹</span>'}
  ${numbers
    .map((n) =>
      n === null
        ? '<span class="gap">…</span>'
        : n === page
        ? `<span class="is-current" aria-current="page">${n}</span>`
        : `<a href="${APP.urlWith({ page: n })}">${n}</a>`
    )
    .join("")}
  ${page < pages ? `<a href="${APP.urlWith({ page: page + 1 })}" aria-label="Siguiente">›</a>` : '<span class="is-disabled">›</span>'}
</nav>`;
};

APP.ui.breadcrumbs = function (trail) {
  return `<nav class="breadcrumbs" aria-label="Ruta de navegación">${trail

/* --------------------------------------------------------------- catalogo -- */
APP.views.products = function (params) {
  const store = APP.store;
  const result = store.search(params);
  const filters = result.filters;
  const category = filters.categoria ? store.category(filters.categoria) : null;
  const [minPrice, maxPrice] = store.priceBounds();
  const subcategories = category ? store.subcategories(category.id) : [];
  const brands = store.brands(filters.categoria);

  const title = filters.q
    ? `Resultados para "${APP.esc(filters.q)}"`
    : category
    ? APP.esc(category.name)
    : "Todos los productos";

  const trail = [{ label: "Inicio", href: APP.url("") }];
  if (category) {
    trail.push({ label: "Productos", href: APP.url("productos") }, { label: category.name });
  } else if (filters.q) {
    trail.push({ label: "Productos", href: APP.url("productos") }, { label: `Resultados para "${filters.q}"` });
  } else {
    trail.push({ label: "Productos" });
  }

  const chips = [];
  filters.marca.forEach((brand) =>
    chips.push(
      `<span class="chip">${APP.esc(brand)} <a href="${APP.urlWith({
        marca: filters.marca.filter((b) => b !== brand),
        page: null,
      })}" aria-label="Quitar filtro">×</a></span>`
    )
  );
  if (filters.subcategoria)
    chips.push(`<span class="chip">${APP.esc(filters.subcategoria)} <a href="${APP.urlWith({ subcategoria: null, page: null })}">×</a></span>`);
  if (filters.oferta) chips.push(`<span class="chip">Solo ofertas <a href="${APP.urlWith({ oferta: null, page: null })}">×</a></span>`);
  if (filters.stock) chips.push(`<span class="chip">Solo disponibles <a href="${APP.urlWith({ stock: null, page: null })}">×</a></span>`);
  if (filters.min !== null) chips.push(`<span class="chip">Desde ${APP.money(filters.min)} <a href="${APP.urlWith({ min: null, page: null })}">×</a></span>`);
  if (filters.max !== null) chips.push(`<span class="chip">Hasta ${APP.money(filters.max)} <a href="${APP.urlWith({ max: null, page: null })}">×</a></span>`);

  const SORT = {
    relevancia: "Relevancia",
    precio_asc: "Precio: menor a mayor",
    precio_desc: "Precio: mayor a menor",
    nuevos: "Más nuevos",
    ofertas: "Mejores ofertas",
    nombre: "Nombre (A-Z)",
  };

  return `
<div class="container">
  ${APP.ui.breadcrumbs(trail)}
  <div style="padding-top:1rem">
    <h1>${title}</h1>
    ${category && category.description ? `<p style="color:var(--muted);max-width:70ch">${APP.esc(category.description)}</p>` : ""}
  </div>
</div>

<div class="container">
  <div class="catalog">
    <div class="filters-backdrop" id="filters-backdrop" hidden></div>

    <aside class="filters" id="filters" aria-label="Filtros">
      <form id="filters-form">
        <div class="panel__head" style="border:0;padding:0 0 .5rem">
          <h3 style="font-size:1rem">Filtros</h3>
          <button type="button" class="link-danger filters__close" data-filters-close style="display:none">Cerrar</button>
        </div>

        <div class="filters__group">
          <h4>Categoría</h4>
          <div class="filters__list">
            <label class="check"><input type="radio" name="categoria" value="" ${!filters.categoria ? "checked" : ""}> Todas</label>
            ${store
              .categories()
              .map(
                (c) => `<label class="check"><input type="radio" name="categoria" value="${c.slug}" ${
                  filters.categoria === c.slug ? "checked" : ""
                }> ${APP.esc(c.name)}</label>`
              )
              .join("")}
          </div>
        </div>

        ${
          subcategories.length
            ? `<div class="filters__group">
                 <h4>Subcategoría</h4>
                 <div class="filters__list">
                   <label class="check"><input type="radio" name="subcategoria" value="" ${!filters.subcategoria ? "checked" : ""}> Todas</label>
                   ${subcategories
                     .map(
                       (s) => `<label class="check"><input type="radio" name="subcategoria" value="${APP.esc(s)}" ${
                         filters.subcategoria === s ? "checked" : ""
                       }> ${APP.esc(s)}</label>`
                     )
                     .join("")}
                 </div>
               </div>`
            : ""
        }

        <div class="filters__group">
          <h4>Marca</h4>
          <div class="filters__list">
            ${brands
              .map(
                (b) => `<label class="check"><input type="checkbox" name="marca" value="${APP.esc(b)}" ${
                  filters.marca.includes(b) ? "checked" : ""
                }> ${APP.esc(b)}</label>`
              )
              .join("")}
          </div>
        </div>

        <div class="filters__group">
          <h4>Precio</h4>
          <div class="price-range">
            <input type="number" name="min" min="0" step="100" placeholder="${Math.round(minPrice)}"
                   value="${filters.min !== null ? filters.min : ""}" aria-label="Precio mínimo">
            <span style="color:var(--muted)">–</span>
            <input type="number" name="max" min="0" step="100" placeholder="${Math.round(maxPrice)}"
                   value="${filters.max !== null ? filters.max : ""}" aria-label="Precio máximo">
          </div>
          <button class="btn btn--sm btn--ghost btn--block" type="submit" style="margin-top:.6rem">Aplicar precio</button>
        </div>

        <div class="filters__group">
          <h4>Otros</h4>
          <label class="check"><input type="checkbox" name="oferta" value="1" ${filters.oferta ? "checked" : ""}> Solo ofertas</label>
          <label class="check"><input type="checkbox" name="stock" value="1" ${filters.stock ? "checked" : ""}> Solo disponibles</label>
        </div>

        <div class="filters__actions">
          <button class="btn btn--block" type="submit">Aplicar filtros</button>
          <a class="btn btn--ghost btn--block" href="${APP.url("productos", filters.q ? { q: filters.q } : {})}">Limpiar todo</a>
        </div>
      </form>
    </aside>

    <section>
      <div class="catalog-toolbar">
        <button class="btn btn--sm btn--ghost filters-toggle" type="button" data-filters-open>⚙ Filtros</button>
        <span class="catalog-toolbar__count">
          <strong>${result.total}</strong> producto${result.total === 1 ? "" : "s"}
          ${result.pages > 1 ? ` · página ${result.page} de ${result.pages}` : ""}
        </span>
        <select class="sort-select" id="sort-select" aria-label="Ordenar por">
          ${Object.keys(SORT)
            .map((value) => `<option value="${value}" ${filters.orden === value ? "selected" : ""}>${SORT[value]}</option>`)
            .join("")}
        </select>
      </div>

      ${chips.length ? `<div class="active-filters">${chips.join("")}</div>` : ""}

      ${
        result.items.length
          ? `<div class="product-grid">${result.items.map(APP.ui.productCard).join("")}</div>
             ${APP.ui.pagination(result.page, result.pages)}`
          : `<div class="panel">${APP.ui.empty({
              icon: "🔍",
              title: "No encontramos productos",
              text: filters.q
                ? `No hay resultados para "${filters.q}". Probá con otras palabras o mirá el catálogo completo.`
                : "Ningún producto coincide con los filtros seleccionados. Probá quitando alguno.",
              action: { href: APP.url("productos"), label: "Ver todos los productos" },
            })}</div>`
      }
    </section>
  </div>
</div>`;
};

/* ------------------------------------------------------ ficha de producto -- */
APP.views.product = function (id) {
  const store = APP.store;
  const product = store.product(id);
  if (!product || !product.active) return APP.views.notFound();

  const category = store.categories().find((c) => c.id === product.categoryId) || { name: "—", slug: "" };
  const related = store.related(product, 5);
  const savings = product.oldPrice && product.oldPrice > product.price ? product.oldPrice - product.price : 0;

  const stockLine =
    product.stock > 5
      ? `<span class="stock-line stock-line--ok"><span class="dot"></span> En stock · ${product.stock} unidades disponibles</span>`
      : product.stock > 0
      ? `<span class="stock-line stock-line--low"><span class="dot"></span> ¡Últimas ${product.stock} unidades!</span>`
      : `<span class="stock-line stock-line--out"><span class="dot"></span> Sin stock por el momento</span>`;

  return `
<div class="container">
  ${APP.ui.breadcrumbs([
    { label: "Inicio", href: APP.url("") },
    { label: "Productos", href: APP.url("productos") },
    { label: category.name, href: APP.url("productos", { categoria: category.slug }) },
    { label: product.name },
  ])}

  <div class="product-detail">
    <div class="product-gallery">
      <div class="product-gallery__badges">
        ${product.onSale && product.discount ? `<span class="badge badge--sale">-${product.discount}% OFF</span>` : ""}
        ${store.isNew(product) ? '<span class="badge badge--new">Nuevo</span>' : ""}
        ${product.featured ? '<span class="badge badge--featured">Destacado</span>' : ""}
        ${product.stock <= 0 ? '<span class="badge badge--out">Sin stock</span>' : ""}
      </div>
      <img src="${APP.images.product(product)}" alt="${APP.esc(product.name)}" width="440" height="440">
    </div>

    <div class="product-info">
      <span class="product-info__brand">${APP.esc(product.brand)}</span>
      <h1>${APP.esc(product.name)}</h1>

      <div class="product-meta">
        <span>SKU: <strong>${APP.esc(product.sku)}</strong></span>
        <span>Categoría: <a href="${APP.url("productos", { categoria: category.slug })}" style="color:var(--brand-dark);font-weight:600">${APP.esc(category.name)}</a></span>
        ${product.subcategory ? `<span>${APP.esc(product.subcategory)}</span>` : ""}
        ${product.unit ? `<span>Presentación: <strong>${APP.esc(product.unit)}</strong></span>` : ""}
      </div>

      <div class="product-price-box">
        <div class="price">
          <span class="price__now">${APP.money(product.price)}</span>
          ${product.oldPrice ? `<span class="price__old">${APP.money(product.oldPrice)}</span>` : ""}
          ${product.discount ? `<span class="price__off">${product.discount}% OFF</span>` : ""}
        </div>
        ${savings ? `<div class="savings">Ahorrás ${APP.money(savings)}</div>` : ""}
        <div style="margin-top:.8rem">${stockLine}</div>

        ${
          product.stock > 0
            ? `<div class="buy-row">
                 <div class="qty" data-qty>
                   <button type="button" data-step="-1" aria-label="Disminuir cantidad">−</button>
                   <label class="sr-only" for="quantity">Cantidad</label>
                   <input id="quantity" type="number" name="quantity" value="1" min="1" max="${product.stock}" inputmode="numeric">
                   <button type="button" data-step="1" aria-label="Aumentar cantidad">+</button>
                 </div>
                 <button class="btn btn--lg" style="flex:1" data-action="add-to-cart" data-id="${product.id}" data-from-qty="1">🛒 Agregar al carrito</button>
               </div>
               <a class="btn btn--ghost btn--block" href="${APP.url("carrito")}" style="margin-top:.6rem">Ir al carrito</a>`
            : `<button class="btn btn--lg btn--block is-disabled" disabled style="margin-top:1rem">Sin stock</button>
               <p class="field-hint" style="text-align:center;margin-top:.5rem">Volvé a consultar en los próximos días.</p>`
        }
      </div>

      <div class="shipping-note">
        <span style="font-size:1.3rem">🚚</span>
        <div>
          <strong>Envío a todo el país.</strong> Gratis en compras superiores a ${APP.money(store.config.freeShipping)};
          por debajo de ese monto el costo es de ${APP.money(store.config.shippingCost)}.
          Entrega estimada: 24 a 48 h hábiles en AMBA, 3 a 6 días en el interior.
        </div>
      </div>

      <div class="product-section">
        <h3>Descripción</h3>
        <p style="color:var(--ink-soft)">${APP.esc(product.description)}</p>
      </div>

      <div class="product-section">
        <h3>Características</h3>
        <div class="spec-list">
          <div><span class="k">Marca</span><span class="v">${APP.esc(product.brand)}</span></div>
          <div><span class="k">Categoría</span><span class="v">${APP.esc(category.name)}</span></div>
          ${product.subcategory ? `<div><span class="k">Tipo</span><span class="v">${APP.esc(product.subcategory)}</span></div>` : ""}
          ${product.unit ? `<div><span class="k">Contenido</span><span class="v">${APP.esc(product.unit)}</span></div>` : ""}
          <div><span class="k">SKU</span><span class="v">${APP.esc(product.sku)}</span></div>
          <div><span class="k">Stock</span><span class="v">${product.stock} un.</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

${
  related.length
    ? `<section class="section section--tinted">
         <div class="container">
           <div class="section-head">
             <div><h2>Productos relacionados</h2><p>Otros productos de ${APP.esc(category.name.toLowerCase())} que podrían interesarte.</p></div>
             <a href="${APP.url("productos", { categoria: category.slug })}">Ver categoría →</a>
           </div>
           <div class="product-grid">${related.map(APP.ui.productCard).join("")}</div>
         </div>
       </section>`
    : ""
}`;
};

APP.views.cart = function () {
  const store = APP.store;
  store.validateCart().forEach((warning) => APP.toast(warning, "info"));
  const items = store.cartItems();
  const summary = store.cartSummary();

  if (!items.length) {
    return `
<div class="container">
  ${APP.ui.breadcrumbs([{ label: "Inicio", href: APP.url("") }, { label: "Carrito" }])}
  <div class="panel" style="margin:1.5rem 0 3rem">
    ${APP.ui.empty({
      icon: "🛒",
      title: "Tu carrito está vacío",
      text: "Todavía no agregaste productos. Explorá el catálogo y encontrá todo lo que necesitás para una limpieza impecable.",
      action: { href: APP.url("productos"), label: "Ver productos" },
    })}
  </div>
</div>`;
  }

  const lines = items
    .map(
      (item) => `
<article class="cart-item" data-cart-line="${item.product.id}">
  <a href="${APP.url("producto/" + item.product.id)}">
    <img class="cart-item__img" src="${APP.images.product(item.product)}" alt="${APP.esc(item.product.name)}" loading="lazy">
  </a>
  <div>
    <a class="cart-item__name" href="${APP.url("producto/" + item.product.id)}">${APP.esc(item.product.name)}</a>
    <div class="cart-item__meta">
      ${APP.esc(item.product.brand)}${item.product.unit ? " · " + APP.esc(item.product.unit) : ""} · SKU ${APP.esc(item.product.sku)}
    </div>
    ${item.product.stock <= 5 ? `<div class="cart-item__meta" style="color:var(--warn);font-weight:600">Quedan ${item.product.stock} unidades</div>` : ""}
    <div class="cart-item__controls">
      <div class="qty qty--sm">
        <button type="button" data-qty-step="-1" aria-label="Quitar una unidad">−</button>
        <label class="sr-only" for="qty-${item.product.id}">Cantidad de ${APP.esc(item.product.name)}</label>
        <input id="qty-${item.product.id}" type="number" name="quantity" value="${item.quantity}" min="1" max="${item.product.stock}" inputmode="numeric">
        <button type="button" data-qty-step="1" aria-label="Agregar una unidad">+</button>
      </div>
      <button class="link-danger" type="button" data-action="remove-line" data-id="${item.product.id}">Eliminar</button>
    </div>
  </div>
  <div class="cart-item__total">
    ${APP.money(item.lineTotal)}
    <span class="cart-item__unit">${APP.money(item.product.price)} c/u</span>
  </div>
</article>`
    )
    .join("");

  const progress = Math.min(100, Math.round((summary.productsTotal / store.config.freeShipping) * 100));

  return `
<div class="container" id="cart-page">
  ${APP.ui.breadcrumbs([{ label: "Inicio", href: APP.url("") }, { label: "Carrito" }])}
  <div class="cart-layout">
    <section class="panel">
      <div class="panel__head">
        <h1 style="font-size:1.25rem;margin:0">Mi carrito (${summary.units} ${summary.units === 1 ? "producto" : "productos"})</h1>
        <button class="link-danger" data-action="clear-cart">Vaciar carrito</button>
      </div>
      ${lines}
      <div class="panel__foot">
        <a class="btn btn--ghost" href="${APP.url("productos")}">← Seguir comprando</a>
      </div>
    </section>

    <aside class="panel summary">
      <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">Resumen de compra</h2></div>
      <div class="panel__body">

        <div class="summary__row">
          <span>Envío</span>
          <span>${summary.freeShipping ? '<strong style="color:var(--ok)">Gratis</strong>' : APP.money(summary.shipping)}</span>

          summary.freeShipping
            ? '<p class="field-hint" style="margin:.5rem 0 0;color:var(--ok)">🎉 ¡Tenés envío gratis!</p>'
            : `<div style="margin-top:.75rem">
                 <div class="progress"><span style="width:${progress}%"></span></div>

               </div>`

          store.currentUser()
            ? ""
            : '<p class="field-hint" style="text-align:center;margin-top:.6rem">Vas a poder iniciar sesión o crear tu cuenta en el próximo paso. Tu carrito se conserva.</p>'

/* --------------------------------------------------------------- checkout -- */
APP.views.checkout = function () {
  const store = APP.store;
  const user = store.currentUser();
  if (!user) {
    APP.toast("Iniciá sesión para completar tu compra.", "info");
    location.hash = APP.url("ingresar", { next: "checkout" }).slice(1);
    return "";
  }

  store.validateCart();
  const items = store.cartItems();
  if (!items.length) {
    APP.toast("Tu carrito está vacío.", "info");
    location.hash = "/productos";
    return "";
  }
  const summary = store.cartSummary();

  return `
<div class="container">
  ${APP.ui.breadcrumbs([
    { label: "Inicio", href: APP.url("") },
    { label: "Carrito", href: APP.url("carrito") },
    { label: "Checkout" },
  ])}

  <div style="padding-top:1rem">
    <h1>Finalizar compra</h1>
    <div class="steps">
      <span class="step is-done"><span class="step__num">✓</span> Carrito</span>
      <span class="step__sep"></span>
      <span class="step is-active"><span class="step__num">2</span> Datos y envío</span>
      <span class="step__sep"></span>
      <span class="step"><span class="step__num">3</span> Confirmación</span>
    </div>
  </div>

  <form id="checkout-form">
    <div class="checkout-layout">
      <div>
        <section class="panel" style="margin-bottom:1.2rem">
          <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">1. Datos del cliente</h2></div>
          <div class="panel__body">
            <div class="form-grid">
              <div class="field">
                <label for="customerName">Nombre y apellido *</label>
                <input id="customerName" name="customerName" value="${APP.esc(user.name)}" required maxlength="120">
              </div>
              <div class="field">
                <label for="customerEmail">Email *</label>
                <input id="customerEmail" type="email" name="customerEmail" value="${APP.esc(user.email)}" required maxlength="255">
              </div>
              <div class="field col-full">
                <label for="customerPhone">Teléfono *</label>
                <input id="customerPhone" type="tel" name="customerPhone" value="${APP.esc(user.phone || "")}" required maxlength="40" placeholder="+54 11 5555-0000">
              </div>
            </div>
          </div>
        </section>

        <section class="panel" style="margin-bottom:1.2rem">
          <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">2. Dirección de envío</h2></div>
          <div class="panel__body">
            <div class="form-grid">
              <div class="field"><label for="street">Calle *</label><input id="street" name="street" required maxlength="200"></div>
              <div class="field"><label for="number">Número *</label><input id="number" name="number" required maxlength="20"></div>
              <div class="field"><label for="city">Ciudad *</label><input id="city" name="city" required maxlength="120"></div>
              <div class="field"><label for="state">Provincia *</label><input id="state" name="state" required maxlength="120"></div>
              <div class="field"><label for="zip">Código postal *</label><input id="zip" name="zip" required maxlength="20"></div>
              <div class="field col-full">
                <label for="notes">Notas para la entrega (opcional)</label>
                <textarea id="notes" name="notes" maxlength="500" placeholder="Timbre, piso, horario preferido…"></textarea>
              </div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">3. Método de pago</h2></div>
          <div class="panel__body">
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="transferencia" checked>
                <span><strong>🏦 Transferencia bancaria</strong><span>Te enviamos los datos por email.</span></span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="tarjeta">
                <span><strong>💳 Tarjeta de crédito o débito</strong><span>Hasta 3 cuotas sin interés.</span></span>
              </label>
              <label class="payment-option">
                <input type="radio" name="paymentMethod" value="efectivo">
                <span><strong>💵 Efectivo al recibir</strong><span>Pagás al repartidor cuando recibís el pedido.</span></span>
              </label>
            </div>
            <p class="field-hint" style="margin-top:1rem">🔒 Tienda de demostración: no se procesan pagos reales ni se solicitan datos de tarjeta.</p>
          </div>
        </section>
      </div>

      <aside class="panel summary">
        <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">Tu pedido</h2></div>
        <div class="panel__body">
          ${items
            .map(
              (item) => `
            <div class="mini-item">
              <img src="${APP.images.product(item.product)}" alt="" loading="lazy">

            <div class="summary__row"><span>Envío</span><span>${summary.freeShipping ? '<strong style="color:var(--ok)">Gratis</strong>' : APP.money(summary.shipping)}</span></div>

</div>`;
};

  const spent = orders.filter((o) => o.status !== "cancelado").reduce((sum, o) => sum + o.total, 0);

  return `
<div class="container">
  ${APP.ui.breadcrumbs([{ label: "Inicio", href: APP.url("") }, { label: "Mi cuenta" }])}
  <div class="account-layout">
    ${APP.ui.accountNav("perfil")}
    <section>

      <div class="stat-row">

        <div class="stat-card"><span>Total comprado</span><strong>${APP.money(spent)}</strong></div>

      <div class="panel" style="margin-bottom:1.2rem">

              <div class="field"><label for="name">Nombre y apellido</label><input id="name" name="name" value="${APP.esc(user.name)}" required minlength="3" maxlength="120"></div>
              <div class="field"><label for="phone">Teléfono</label><input id="phone" type="tel" name="phone" value="${APP.esc(user.phone || "")}" maxlength="40"></div>
              <div class="field col-full">
                <label for="email">Email</label>
                <input id="email" value="${APP.esc(user.email)}" disabled>

            <button class="btn" type="submit">Guardar cambios</button>

        <div class="panel__head"><h2 style="font-size:1.05rem;margin:0">Cambiar contraseña</h2></div>
        <div class="panel__body">
          <form id="password-form">
            <div class="form-grid">
              <div class="field col-full"><label for="current">Contraseña actual</label><input id="current" type="password" name="current" required></div>
              <div class="field"><label for="next">Nueva contraseña</label><input id="next" type="password" name="next" required minlength="8"></div>
              <div class="field"><label for="confirm">Repetir nueva contraseña</label><input id="confirm" type="password" name="confirm" required minlength="8"></div>
            </div>
            <button class="btn btn--ghost" type="submit">Actualizar contraseña</button>
          </form>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h2 style="font-size:1.05rem;margin:0">Últimos pedidos</h2>
          <a href="${APP.url("mis-pedidos")}" style="font-size:.85rem;font-weight:600;color:var(--brand-dark)">Ver todos →</a>
        </div>
        ${
          orders.length
            ? `<div class="table-wrap"><table class="data">
                 <thead><tr><th>Pedido</th><th>Fecha</th><th>Estado</th><th class="num">Total</th><th></th></tr></thead>
                 <tbody>${orders
                   .slice(0, 5)
                   .map(
                     (o) => `<tr>
                       <td><strong>${APP.esc(o.number)}</strong></td>
                       <td>${APP.date(o.createdAt)}</td>
                       <td>${APP.ui.statusChip(o.status)}</td>
                       <td class="num"><strong>${APP.money(o.total)}</strong></td>
                       <td class="num"><a href="${APP.url("mis-pedidos/" + o.number)}" style="color:var(--brand-dark);font-weight:600">Ver</a></td>
                     </tr>`
                   )
                   .join("")}</tbody></table></div>`
            : `<div class="empty-state" style="padding:2.2rem 1rem">
                 <div class="empty-state__icon">📦</div><h3>Sin pedidos todavía</h3>

                 <a class="btn btn--sm" href="${APP.url("productos")}">Ver productos</a>
               </div>`

APP.views.orderDetail = function (number) {
  const store = APP.store;
  const user = store.currentUser();
  if (!user) return APP.views.requireLogin("mis-pedidos/" + number);
  const order = store.order(number);
  if (!order || (order.userId !== user.id && user.role !== "admin")) return APP.views.notFound();

  const flow = ["pendiente", "confirmado", "preparando", "enviado", "entregado"];
  const currentIndex = flow.indexOf(order.status);

  return `
<div class="container">
  ${APP.ui.breadcrumbs([
    { label: "Inicio", href: APP.url("") },
    { label: "Mis pedidos", href: APP.url("mis-pedidos") },
    { label: order.number },
  ])}
  <div class="account-layout">
    ${APP.ui.accountNav("pedidos")}
    <section>
      <div class="panel">
        <div class="panel__head">
          <div>
            <h1 style="font-size:1.2rem;margin:0">Pedido ${APP.esc(order.number)}</h1>
            <span class="order-card__date">Realizado el ${APP.dateTime(order.createdAt)}</span>
          </div>
          ${APP.ui.statusChip(order.status)}
        </div>

        <div class="panel__body">
          ${
            order.status !== "cancelado"
              ? `<div class="timeline">${flow
                  .map(
                    (step, index) =>
                      `<div class="timeline__step ${index <= currentIndex ? "is-done" : ""}">${step.charAt(0).toUpperCase() + step.slice(1)}</div>`
                  )
                  .join("")}</div>`
              : `<p style="color:var(--danger);font-weight:600">Este pedido fue cancelado. Si tenés dudas, escribinos a ${APP.esc(store.config.email)}.</p>`
          }

          <div class="form-grid" style="gap:1rem;margin-top:1rem">
            <div>
              <h3 style="font-size:.95rem">Datos de envío</h3>
              <p style="color:var(--ink-soft);font-size:.9rem">
                ${APP.esc(order.customerName)}<br>${APP.esc(store.fullAddress(order))}<br>
                ${APP.esc(order.customerPhone || "")} · ${APP.esc(order.customerEmail)}
              </p>
            </div>
            <div>
              <h3 style="font-size:.95rem">Pago</h3>
              <p style="color:var(--ink-soft);font-size:.9rem">
                ${APP.esc(store.PAYMENT_METHODS[order.paymentMethod] || order.paymentMethod)}<br>
                ${store.orderUnits(order)} producto${store.orderUnits(order) === 1 ? "" : "s"}<br>
                Total: <strong>${APP.money(order.total)}</strong>
              </p>
            </div>
          </div>
          ${order.notes ? `<p class="field-hint"><strong>Notas:</strong> ${APP.esc(order.notes)}</p>` : ""}
        </div>

        <div class="panel__body" style="border-top:1px solid var(--line)">

/* ------------------------------------------------------------- dashboard -- */

  const low = store.lowStock(APP.admin.LOW_STOCK, 10);
  const top = store.topProducts(6);

  const inner = `

  <div class="kpi kpi--ok">
    <div class="kpi__icon">💰</div><div class="kpi__label">Ventas totales</div>
    <div class="kpi__value">${APP.money(stats.revenue)}</div>
    <div class="kpi__hint">Ticket promedio ${APP.money(stats.avgTicket)}</div>
  </div>
  <div class="kpi">
    <div class="kpi__icon">🧾</div><div class="kpi__label">Pedidos</div>
    <div class="kpi__value">${stats.orders}</div>

  <div class="kpi">

    <div class="kpi__value">${stats.users}</div>
    <div class="kpi__hint">Registrados en la tienda</div>

  <div class="kpi">
    <div class="kpi__icon">📦</div><div class="kpi__label">Productos activos</div>
    <div class="kpi__value">${stats.products}</div>
    <div class="kpi__hint">En el catálogo público</div>
  </div>
  <div class="kpi kpi--danger">
    <div class="kpi__icon">⚠️</div><div class="kpi__label">Sin stock</div>
    <div class="kpi__value">${stats.outOfStock}</div>
    <div class="kpi__hint"><a href="${APP.url("admin/productos", { stock: "bajo" })}" style="color:var(--brand-dark);font-weight:600">Ver productos a reponer →</a></div>
  </div>
</div>

<div class="admin-grid">
  <section class="admin-card">
    <div class="admin-card__head">
      <h2>Ventas de los últimos 14 días</h2>
      <span class="admin-topbar__sub">Pedidos no cancelados</span>
    </div>
    <div class="admin-card__body">
      <div class="chart">
        ${chart
          .map(
            (day) => `
          <div class="chart__col" title="${day.label}: ${APP.money(day.value)}">
            <span class="chart__value">${day.value ? (day.value / 1000).toFixed(1) + "k" : ""}</span>
            <div class="chart__bar" style="height:${((day.value / maxValue) * 100).toFixed(1)}%"></div>
            <span class="chart__label">${day.label}</span>
          </div>`
          )
          .join("")}
      </div>
    </div>
  </section>

  <section class="admin-card">
    <div class="admin-card__head"><h2>Pedidos por estado</h2></div>
    <div class="admin-card__body">
      <div class="bar-list">
        ${store.STATUSES.map(
          (status) => `
          <div class="bar-list__item">
            <div class="bar-list__head">
              <a href="${APP.url("admin/pedidos", { estado: status })}">${APP.ui.statusChip(status)}</a>
              <strong>${counts[status] || 0}</strong>
            </div>
            <div class="bar-list__track">
              <div class="bar-list__fill" style="width:${(((counts[status] || 0) / totalOrders) * 100).toFixed(1)}%"></div>
            </div>
          </div>`

</div>

<div class="admin-grid" style="margin-top:1.25rem">
  <section class="admin-card">

      <a href="${APP.url("admin/pedidos")}" style="font-size:.85rem;font-weight:600;color:var(--brand-dark)">Ver todos →</a>
    </div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th class="num">Total</th></tr></thead>
        <tbody>
          ${
            recent.length
              ? recent
                  .map(
                    (order) => `
            <tr>

  <section class="admin-card">
    <div class="admin-card__head">

      <a href="${APP.url("admin/productos", { stock: "bajo" })}" style="font-size:.85rem;font-weight:600;color:var(--brand-dark)">Ver todos →</a>

      <table class="data">
        <thead><tr><th>Producto</th><th class="num">Stock</th><th></th></tr></thead>

                    (product) => `

                  <img class="thumb" src="${APP.images.product(product)}" alt="">

              </td>

                product.stock === 0
